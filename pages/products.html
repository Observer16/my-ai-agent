<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление товарами</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Подключаем внешний CSS файл -->
    <link rel="stylesheet" href="../css/products.css">
</head>
<body>
<div class="header">
    <h1>📦 Управление товарами</h1>
    <p>Товары, категории и получатели</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('products')">🛒 Товары</div>
    <div class="tab" onclick="switchTab('categories')">📂 Категории</div>
    <div class="tab" onclick="switchTab('stores')">👥 Получатели</div>
</div>

<!-- Товары -->
<div id="tab-products" class="content active">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="total-products">-</div>
            <div class="stat-label">Товаров</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="total-categories">-</div>
            <div class="stat-label">Категорий</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="uncategorized">-</div>
            <div class="stat-label">Без категории</div>
        </div>
    </div>

    <div class="search">
        <input type="text" id="product-search" placeholder="🔍 Поиск товара..."
               onkeyup="searchProducts(this.value)">
    </div>

    <div class="filter-section">
        <div class="filter-label">Категория</div>
        <div class="category-filter" id="category-filters"></div>
    </div>

    <div id="products-list"></div>
</div>

<!-- Категории -->
<div id="tab-categories" class="content">
    <div id="categories-list"></div>
</div>

<!-- Получатели (Магазины) -->
<div id="tab-stores" class="content">
    <div id="stores-list"></div>
</div>

<!-- Кнопки создания внизу -->
<div class="create-buttons">
    <!-- Кнопка для категорий -->
    <button class="create-btn" id="btn-create-category" onclick="showCreateCategoryModal()" style="display: none;">
        📂 Создать категорию
    </button>
    
    <!-- Кнопка для получателей -->
    <button class="create-btn" id="btn-edit-store" onclick="showEditStoreModal()" style="display: none;">
        ✏️ Редактировать
    </button>
</div>

<!-- Модальное окно создания категории -->
<div class="modal" id="create-category-modal">
    <div class="modal-content">
        <div class="modal-header">Новая категория</div>
        <div class="form-group">
            <label class="form-label">Название *</label>
            <input type="text" class="form-input" id="new-category-name"
                   placeholder="Например: Фрукты">
        </div>
        <div class="form-group">
            <label class="form-label">Описание</label>
            <textarea class="form-textarea" id="new-category-description"
                      placeholder="Описание категории (опционально)"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Родительская категория</label>
            <select class="form-select" id="new-category-parent">
                <option value="">Нет (основная категория)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('create-category-modal')">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="createCategory()">
                Создать
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно создания товара -->
<div class="modal" id="create-product-modal">
    <div class="modal-content">
        <div class="modal-header">Новый товар</div>
        <div class="form-group">
            <label class="form-label">Название *</label>
            <input type="text" class="form-input" id="new-product-name"
                   placeholder="Например: Яблоки">
        </div>
        <div class="form-group">
            <label class="form-label">Бренд</label>
            <input type="text" class="form-input" id="new-product-brand"
                   placeholder="Бренд (опционально)">
        </div>
        <div class="form-group">
            <label class="form-label">Категория</label>
            <select class="form-select" id="new-product-category">
                <option value="">Без категории</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Единица измерения</label>
            <select class="form-select" id="new-product-unit">
                <option value="unidad">Штука</option>
                <option value="kg">Килограмм</option>
                <option value="g">Грамм</option>
                <option value="l">Литр</option>
                <option value="ml">Миллилитр</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Штрих-код</label>
            <input type="text" class="form-input" id="new-product-barcode"
                   placeholder="Штрих-код (опционально)" inputmode="numeric">
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('create-product-modal')">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="createProduct()">
                Создать
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования товара -->
<div class="modal" id="edit-product-modal">
    <div class="modal-content">
        <div class="modal-header">Изменить категорию</div>
        <div id="edit-product-info" style="margin-bottom: 15px;"></div>
        <div class="form-group">
            <label class="form-label">Категория</label>
            <select class="form-select" id="edit-product-category"></select>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('edit-product-modal')">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="updateProductCategory()">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования магазина -->
<div class="modal" id="edit-store-modal">
    <div class="modal-content">
        <div class="modal-header">Редактировать магазин</div>
        <div class="form-group">
            <label class="form-label">Выберите магазин</label>
            <select class="form-select" id="store-select" onchange="loadStoreData()">
                <option value="">-- Выберите магазин --</option>
            </select>
        </div>
        <div id="store-edit-fields" style="display: none;">
            <div class="form-group">
                <label class="form-label">Название *</label>
                <input type="text" class="form-input" id="store-name" placeholder="Название магазина">
            </div>
            <div class="form-group">
                <label class="form-label">Тип магазина</label>
                <input type="text" class="form-input" id="store-type" placeholder="Например: Супермаркет">
            </div>
            <div class="form-group">
                <label class="form-label">RUC (опционально)</label>
                <input type="text" class="form-input" id="store-ruc" placeholder="RUC магазина">
            </div>
            <div class="form-group">
                <label class="form-label">Адрес (опционально)</label>
                <textarea class="form-textarea" id="store-address" placeholder="Адрес магазина"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('edit-store-modal')">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="updateStore()" id="save-store-btn" style="display: none;">
                Сохранить
            </button>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/api.js"></script>
<script>
    // Глобальные переменные
    const tg = window.Telegram.WebApp;
    let allProducts = [];
    let allCategories = [];
    let allStores = [];
    let currentCategoryFilter = null;
    let currentProductEdit = null;
    let currentStoreEdit = null;
    let searchTimeout = null;
    let currentTab = 'products';

    // Инициализация приложения
    function init() {
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => window.location.href = '../index.html');

        loadData();
        updateButtonsVisibility();
    }

    // Загрузка всех данных
    async function loadData() {
        try {
            await Promise.all([
                loadStatistics(),
                loadCategories(),
                loadStores()
            ]);
            await loadProducts();
            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Ошибка инициализации:', error);
            tg.showAlert('Ошибка загрузки данных');
        }
    }

    // Загрузка статистики
    async function loadStatistics() {
        try {
            const stats = await API.getStatistics();
            document.getElementById('total-products').textContent = stats.unique_products || 0;
        } catch (error) {
            console.error('Ошибка загрузки статистики:', error);
            document.getElementById('total-products').textContent = '-';
        }
    }

    // Загрузка категорий
    async function loadCategories() {
        try {
            allCategories = await API.getCategories();
            updateCategoryStatistics();
            renderCategoryFilters();
            renderCategoriesList();
            populateCategorySelects();
        } catch (error) {
            console.error('Ошибка загрузки категорий:', error);
        }
    }

    // Загрузка магазинов
    async function loadStores() {
        try {
            allStores = await API.getStores();
            populateStoreSelect();
            renderStoresList();
        } catch (error) {
            console.error('Ошибка загрузки магазинов:', error);
        }
    }

    // Рендеринг списка магазинов
    function renderStoresList() {
        const container = document.getElementById('stores-list');

        if (!allStores || allStores.length === 0) {
            container.innerHTML = '<div class="empty">🏪 Магазины не найдены</div>';
            return;
        }

        const html = allStores.map(store => {
            const name = escapeHtml(store.name);
            const storeType = store.store_type ? escapeHtml(store.store_type) : 'Магазин';
            const ruc = store.ruc ? escapeHtml(store.ruc) : '';
            const address = store.address ? escapeHtml(store.address) : '';

            return `
            <div class="category-card">
                <div class="category-header">
                    <div class="category-name">${name}</div>
                    <div class="product-category" style="background: var(--tg-theme-button-color, #3390ec);">${storeType}</div>
                </div>
                ${ruc ? `<div class="category-description">📄 RUC: ${ruc}</div>` : ''}
                ${address ? `<div class="category-description">📍 ${address}</div>` : ''}
            </div>
        `}).join('');

        container.innerHTML = html;
    }

    // Заполнение селекта магазинов
    function populateStoreSelect() {
        const select = document.getElementById('store-select');
        select.innerHTML = '<option value="">-- Выберите магазин --</option>' +
            allStores.map(store => `<option value="${store.id}">${escapeHtml(store.name)}</option>`).join('');
    }

    // Загрузка данных магазина
    function loadStoreData() {
        const storeId = document.getElementById('store-select').value;
        if (!storeId) {
            document.getElementById('store-edit-fields').style.display = 'none';
            document.getElementById('save-store-btn').style.display = 'none';
            return;
        }

        const store = allStores.find(s => s.id === storeId);
        if (!store) return;

        currentStoreEdit = store;
        document.getElementById('store-name').value = store.name;
        document.getElementById('store-type').value = store.store_type || '';
        document.getElementById('store-ruc').value = store.ruc || '';
        document.getElementById('store-address').value = store.address || '';
        document.getElementById('store-edit-fields').style.display = 'block';
        document.getElementById('save-store-btn').style.display = 'block';
    }

    // Показать модальное окно редактирования магазина
    function showEditStoreModal() {
        if (allStores.length === 0) {
            tg.showAlert('Нет доступных магазинов для редактирования');
            return;
        }
        document.getElementById('store-select').value = '';
        document.getElementById('store-edit-fields').style.display = 'none';
        document.getElementById('save-store-btn').style.display = 'none';
        openModal('edit-store-modal');
        tg.HapticFeedback.impactOccurred('medium');
    }

    // Обновить магазин
    async function updateStore() {
        if (!currentStoreEdit) return;

        const name = document.getElementById('store-name').value.trim();
        if (!name) {
            tg.showAlert('Введите название магазина');
            return;
        }

        try {
            const storeData = {
                name: name,
                store_type: document.getElementById('store-type').value.trim() || null,
                ruc: document.getElementById('store-ruc').value.trim() || null,
                address: document.getElementById('store-address').value.trim() || null
            };

            await API.updateStore(currentStoreEdit.id, storeData);
            closeModal('edit-store-modal');
            await loadStores();
            tg.showAlert(`✅ Магазин "${name}" обновлён`);
            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Ошибка обновления магазина:', error);
            tg.showAlert('Ошибка обновления: ' + error.message);
        }
    }

    // Обновление статистики категорий
    function updateCategoryStatistics() {
        document.getElementById('total-categories').textContent = allCategories.length;

        if (allProducts.length > 0) {
            const uncategorizedCount = allProducts.filter(p => !p.category_id).length;
            document.getElementById('uncategorized').textContent = uncategorizedCount;
        }
    }

    // Загрузка товаров
    async function loadProducts(categoryId = null, search = null) {
        showLoading('products-list');
        try {
            allProducts = await API.getProducts(categoryId, search, 50);
            renderProducts(allProducts);
            updateUncategorizedCount();
        } catch (error) {
            console.error('Ошибка загрузки товаров:', error);
            showError('products-list', error.message);
        }
    }

    // Обновление счетчика товаров без категории
    function updateUncategorizedCount() {
        const uncategorizedCount = allProducts.filter(p => !p.category_id).length;
        document.getElementById('uncategorized').textContent = uncategorizedCount;
    }

    // Рендеринг фильтров категорий
    function renderCategoryFilters() {
        const container = document.getElementById('category-filters');
        const mainCategories = allCategories.filter(c => !c.parent_id);

        const html = `
            <div class="category-chip ${!currentCategoryFilter ? 'active' : ''}"
                 onclick="filterByCategory(null)">
                Все
            </div>
            ${mainCategories.map(cat => `
                <div class="category-chip ${currentCategoryFilter === cat.id ? 'active' : ''}"
                     onclick="filterByCategory(${cat.id})">
                    ${cat.name} (${cat.products_count || 0})
                </div>
            `).join('')}
        `;

        container.innerHTML = html;
    }

    // Рендеринг товаров
    function renderProducts(products) {
        const container = document.getElementById('products-list');

        if (!products || products.length === 0) {
            container.innerHTML = '<div class="empty">📦 Товары не найдены</div>';
            return;
        }

        const html = products.map(p => {
            const name = escapeHtml(p.name);
            const categoryName = p.category_name ? escapeHtml(p.category_name) : '';
            const brand = p.brand ? escapeHtml(p.brand) : '';

            return `
            <div class="product-card" onclick="showEditProductModal('${p.id}', '${name}', ${p.category_id || 'null'})">
                <div class="product-header">
                    <div class="product-name">${name}</div>
                    ${categoryName ? `
                        <div class="product-category">${categoryName}</div>
                    ` : ''}
                </div>
                <div class="product-info">
                    ${brand ? `<span>🏷️ ${brand}</span>` : ''}
                    ${p.stores_count ? `<span>🏪 ${p.stores_count} магазинов</span>` : ''}
                    ${p.last_purchase_date ? `<span>📅 ${formatDate(p.last_purchase_date)}</span>` : ''}
                </div>
                ${p.min_price ? `
                    <div class="product-prices">
                        <div class="price-badge">
                            <strong>${p.min_price.toFixed(0)} ₲</strong> мин
                        </div>
                        <div class="price-badge">
                            <strong>${p.max_price.toFixed(0)} ₲</strong> макс
                        </div>
                        ${p.avg_price ? `
                            <div class="price-badge">
                                <strong>${p.avg_price.toFixed(0)} ₲</strong> сред
                            </div>
                        ` : ''}
                    </div>
                ` : ''}
            </div>
        `}).join('');

        container.innerHTML = html;
    }

    // Рендеринг списка категорий
    function renderCategoriesList() {
        const container = document.getElementById('categories-list');

        if (!allCategories || allCategories.length === 0) {
            container.innerHTML = '<div class="empty">📂 Категории не найдены</div>';
            return;
        }

        const html = allCategories.map(cat => {
            const name = escapeHtml(cat.name);
            const parentName = cat.parent_name ? escapeHtml(cat.parent_name) : '';
            const description = cat.description ? escapeHtml(cat.description) : '';

            return `
            <div class="category-card">
                <div class="category-header">
                    <div class="category-name">
                        ${name}
                        ${parentName ? `<div style="font-size:11px;opacity:0.6;margin-top:2px;">↳ ${parentName}</div>` : ''}
                    </div>
                    <div class="category-count">${cat.products_count || 0}</div>
                </div>
                ${description ? `
                    <div class="category-description">${description}</div>
                ` : ''}
                <div class="category-actions">
                    <button class="category-btn edit" onclick="filterByCategory(${cat.id}); switchTab('products')">
                        👁️ Товары
                    </button>
                    ${(cat.products_count || 0) === 0 ? `
                        <button class="category-btn delete" onclick="deleteCategory(${cat.id}, '${name}')">
                            🗑️ Удалить
                        </button>
                    ` : ''}
                </div>
            </div>
        `}).join('');

        container.innerHTML = html;
    }

    // Заполнение селектов категорий
    function populateCategorySelects() {
        const mainCategories = allCategories.filter(c => !c.parent_id);

        const parentSelect = document.getElementById('new-category-parent');
        parentSelect.innerHTML = '<option value="">Нет (основная категория)</option>' +
            mainCategories.map(cat => `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`).join('');

        const productCategorySelect = document.getElementById('new-product-category');
        productCategorySelect.innerHTML = '<option value="">Без категории</option>' +
            allCategories.map(cat => `
                <option value="${cat.id}">
                    ${cat.parent_name ? '  ↳ ' : ''}${escapeHtml(cat.name)}
                </option>
            `).join('');

        const editSelect = document.getElementById('edit-product-category');
        editSelect.innerHTML = '<option value="">Без категории</option>' +
            allCategories.map(cat => `
                <option value="${cat.id}">
                    ${cat.parent_name ? '  ↳ ' : ''}${escapeHtml(cat.name)}
                </option>
            `).join('');
    }

    // Обновление видимости кнопок в зависимости от активного таба
    function updateButtonsVisibility() {
        const btnCreateCategory = document.getElementById('btn-create-category');
        const btnEditStore = document.getElementById('btn-edit-store');

        // Скрываем все кнопки
        btnCreateCategory.style.display = 'none';
        btnEditStore.style.display = 'none';

        // Показываем нужную кнопку в зависимости от таба
        if (currentTab === 'categories') {
            btnCreateCategory.style.display = 'block';
        } else if (currentTab === 'stores') {
            btnEditStore.style.display = 'block';
        }
    }

    // Фильтр по категории
    function filterByCategory(categoryId) {
        currentCategoryFilter = categoryId;
        loadProducts(categoryId);
        renderCategoryFilters();
        tg.HapticFeedback.impactOccurred('light');
    }

    // Поиск товаров
    function searchProducts(query) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            loadProducts(currentCategoryFilter, query || null);
        }, 500);
    }

    // Показать модальное окно создания категории
    function showCreateCategoryModal() {
        document.getElementById('new-category-name').value = '';
        document.getElementById('new-category-description').value = '';
        document.getElementById('new-category-parent').value = '';
        openModal('create-category-modal');
        tg.HapticFeedback.impactOccurred('medium');
    }

    // Показать модальное окно создания товара
    function showCreateProductModal() {
        document.getElementById('new-product-name').value = '';
        document.getElementById('new-product-brand').value = '';
        document.getElementById('new-product-category').value = '';
        document.getElementById('new-product-unit').value = 'unidad';
        document.getElementById('new-product-barcode').value = '';
        openModal('create-product-modal');
        tg.HapticFeedback.impactOccurred('medium');
    }

    // Создать категорию
    async function createCategory() {
        const name = document.getElementById('new-category-name').value.trim();

        if (!name) {
            tg.showAlert('Введите название категории');
            return;
        }

        try {
            const description = document.getElementById('new-category-description').value.trim() || null;
            const parentId = document.getElementById('new-category-parent').value || null;

            await API.createCategory(name, description, parentId ? parseInt(parentId) : null);

            closeModal('create-category-modal');
            await loadCategories();
            switchTab('categories');

            tg.showPopup({
                title: 'Успех',
                message: `Категория "${name}" создана`,
                buttons: [{type: 'ok'}]
            });

            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Ошибка создания категории:', error);
            tg.showAlert('Ошибка создания категории: ' + error.message);
        }
    }

    // Создать товар
    async function createProduct() {
        const name = document.getElementById('new-product-name').value.trim();

        if (!name) {
            tg.showAlert('Введите название товара');
            return;
        }

        try {
            const brand = document.getElementById('new-product-brand').value.trim() || null;
            const categoryId = document.getElementById('new-product-category').value || null;
            const unit = document.getElementById('new-product-unit').value;
            const barcode = document.getElementById('new-product-barcode').value.trim() || null;

            const productData = {
                name: name,
                category_id: categoryId ? parseInt(categoryId) : null,
                brand: brand,
                unit: unit,
                barcode: barcode
            };

            await API.createProduct(productData);

            closeModal('create-product-modal');
            await loadProducts();
            switchTab('products');

            tg.showAlert(`✅ Товар "${name}" создан`);
            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('❌ Ошибка создания товара:', error);
            tg.showAlert('Ошибка создания товара: ' + error.message);
        }
    }

    // Удалить категорию
    async function deleteCategory(categoryId, categoryName) {
        tg.showConfirm(
            `Удалить категорию "${categoryName}"?`,
            async (confirmed) => {
                if (confirmed) {
                    try {
                        await API.deleteCategory(categoryId);
                        await loadCategories();
                        tg.HapticFeedback.notificationOccurred('success');
                    } catch (error) {
                        console.error('Ошибка удаления категории:', error);
                        tg.showAlert('Ошибка удаления: ' + error.message);
                    }
                }
            }
        );
    }

    // Показать модальное окно редактирования товара
    function showEditProductModal(productId, productName, categoryId) {
        currentProductEdit = productId;

        const editInfo = document.getElementById('edit-product-info');
        editInfo.innerHTML = '';

        const nameDiv = document.createElement('div');
        nameDiv.style.fontWeight = '600';
        nameDiv.style.marginBottom = '5px';
        nameDiv.innerText = productName;

        const idDiv = document.createElement('div');
        idDiv.style.fontSize = '12px';
        idDiv.style.opacity = '0.7';
        idDiv.innerText = `ID: ${productId}`;

        editInfo.appendChild(nameDiv);
        editInfo.appendChild(idDiv);

        const select = document.getElementById('edit-product-category');
        select.value = categoryId !== 'null' ? categoryId : '';

        openModal('edit-product-modal');
        tg.HapticFeedback.impactOccurred('light');
    }

    // Обновить категорию товара
    async function updateProductCategory() {
        const categoryId = document.getElementById('edit-product-category').value;

        if (!currentProductEdit) {
            tg.showAlert('Ошибка: товар не выбран');
            return;
        }

        try {
            await API.updateProductCategory(currentProductEdit, categoryId ? parseInt(categoryId) : null);

            closeModal('edit-product-modal');
            await loadProducts(currentCategoryFilter);

            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Ошибка обновления категории товара:', error);
            tg.showAlert('Ошибка обновления: ' + error.message);
        }
    }

    // Переключение табов
    function switchTab(tab) {
        const tabs = document.querySelectorAll('.tab');
        const clickedTab = event.target;

        tabs.forEach(t => t.classList.remove('active'));
        clickedTab.classList.add('active');

        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');

        currentTab = tab;
        updateButtonsVisibility();

        tg.HapticFeedback.impactOccurred('light');
    }

    // Вспомогательные функции
    function formatDate(dateStr) {
        if (!dateStr) return '';

        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;

        const now = new Date();
        const diffTime = now - date;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return 'Сегодня';
        if (diffDays === 1) return 'Вчера';
        if (diffDays < 7) return `${diffDays} дн. назад`;

        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function showLoading(id) {
        const container = document.getElementById(id);
        if (container) {
            container.innerHTML = '<div class="loading">⏳ Загрузка...</div>';
        }
    }

    function showError(id, msg) {
        const container = document.getElementById(id);
        if (container) {
            container.innerHTML = `<div class="error">❌ ${escapeHtml(msg)}</div>`;
        }
    }

    // Запуск приложения
    init();
</script>
</body>
</html>

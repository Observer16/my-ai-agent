<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Доктор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h2 { margin: 0 0 10px 0; font-weight: 600; }
        p { color: var(--tg-theme-hint-color, #999999); margin: 0 0 30px 0; }

        .loader {
            border: 4px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 4px solid var(--tg-theme-button-color, #3498db);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-back {
            background-color: var(--tg-theme-secondary-bg-color, #efefef);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
        }
    </style>
</head>
<body>

    <div class="icon">👨‍⚕️</div>
    <h2>AI Доктор</h2>
    <div class="loader"></div>
    <p>Настраиваем нейросеть для консультаций...<br>Чат станет доступен в ближайшем обновлении.</p>

    <button class="btn-back" onclick="goBack()">Понятно</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(goBack);

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>

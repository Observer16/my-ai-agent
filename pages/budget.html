<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding-bottom: 70px;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        
        .tabs {
            display: flex;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 5px;
            gap: 5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
        }
        
        .content { display: none; padding: 15px; }
        .content.active { display: block; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
        }
        .stat .label {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .search {
            margin-bottom: 15px;
        }
        .search input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
            border-radius: 10px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            font-size: 14px;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
        }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: none;
        }
        .filter-btn.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
        }
        
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .card.up { border-left: 3px solid #ef4444; }
        .card.down { border-left: 3px solid #10b981; }
        .card.new { border-left: 3px solid #3b82f6; }
        
        .product-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .store {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        .prices {
            display: flex;
            gap: 12px;
            font-size: 13px;
            align-items: center;
        }
        .price-current {
            font-weight: 700;
            font-size: 16px;
        }
        .price-old {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .price-change {
            font-weight: 600;
        }
        .price-change.up { color: #ef4444; }
        .price-change.down { color: #10b981; }
        
        .comparison-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .comparison-header {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .store-price {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            margin-bottom: 5px;
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 8px;
            font-size: 13px;
        }
        .store-price.best {
            border: 2px solid #10b981;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
        }
        .empty {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Покупки в супермаркетах</h1>
        <p>Анализ цен и экономия</p>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('overview')">📊 Обзор</div>
        <div class="tab" onclick="switchTab('trends')">📈 Тренды</div>
        <div class="tab" onclick="switchTab('compare')">🏪 Сравнение</div>
    </div>
    
    <!-- Обзор -->
    <div id="tab-overview" class="content active">
        <div class="stats">
            <div class="stat">
                <div class="value" id="total">-</div>
                <div class="label">Расходы</div>
            </div>
            <div class="stat">
                <div class="value" id="purchases">-</div>
                <div class="label">Покупок</div>
            </div>
            <div class="stat">
                <div class="value" id="products">-</div>
                <div class="label">Товаров</div>
            </div>
            <div class="stat">
                <div class="value" id="stores">-</div>
                <div class="label">Магазинов</div>
            </div>
        </div>
        
        <div class="section-title">📈 Последние изменения (7 дней)</div>
        <div id="quick-trends"></div>
    </div>
    
    <!-- Тренды -->
    <div id="tab-trends" class="content">
        <div class="filters">
            <button class="filter-btn active" onclick="filterTrends(7)">7 дней</button>
            <button class="filter-btn" onclick="filterTrends(30)">30 дней</button>
            <button class="filter-btn" onclick="filterTrends(90)">90 дней</button>
        </div>
        
        <div class="search">
            <input type="text" placeholder="🔍 Поиск товара..." onkeyup="searchTrends(this.value)">
        </div>
        
        <div id="trends-list"></div>
    </div>
    
    <!-- Сравнение -->
    <div id="tab-compare" class="content">
        <div class="search">
            <input type="text" placeholder="🔍 Поиск товара..." onkeyup="searchCompare(this.value)">
        </div>
        
        <div id="compare-list"></div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => window.location.href = '../index.html');
        
        let currentDays = 7;
        let trendsData = [];
        let compareData = [];
        
        // Инициализация
        async function init() {
            try {
                await loadOverview();
                tg.HapticFeedback.notificationOccurred('success');
            } catch (error) {
                console.error('Init error:', error);
            }
        }
        
        // Загрузка обзора
        async function loadOverview() {
            try {
                const stats = await API.getStatistics();
                document.getElementById('total').textContent = formatMoney(stats.total_spent);
                document.getElementById('purchases').textContent = stats.total_purchases;
                document.getElementById('products').textContent = stats.unique_products;
                document.getElementById('stores').textContent = stats.unique_stores;
                
                const trends = await API.getPriceTrends(7, null, 5);
                renderTrends(trends, 'quick-trends');
            } catch (error) {
                showError('quick-trends', error.message);
            }
        }
        
        // Загрузка трендов
        async function loadTrends(days = 7, search = null) {
            showLoading('trends-list');
            try {
                trendsData = await API.getPriceTrends(days, search, 50);
                renderTrends(trendsData, 'trends-list');
            } catch (error) {
                showError('trends-list', error.message);
            }
        }
        
        // Загрузка сравнения
        async function loadCompare(search = null) {
            showLoading('compare-list');
            try {
                compareData = await API.comparePrices(search, 50);
                renderCompare(compareData);
            } catch (error) {
                showError('compare-list', error.message);
            }
        }
        
        // Рендеринг трендов
        function renderTrends(trends, containerId) {
            const container = document.getElementById(containerId);
            
            if (!trends?.length) {
                container.innerHTML = '<div class="empty">📊 Нет данных</div>';
                return;
            }
            
            const html = trends.map(t => `
                <div class="card ${t.trend_direction}">
                    <div class="product-name">${t.product_name}</div>
                    <div class="store">🏪 ${t.store_name}</div>
                    <div class="prices">
                        <span class="price-current">${t.current_price.toFixed(0)} ₲</span>
                        ${t.previous_price ? `
                            <span class="price-old">${t.previous_price.toFixed(0)} ₲</span>
                            <span class="price-change ${t.trend_direction}">
                                ${t.trend_direction === 'up' ? '📈' : '📉'} 
                                ${Math.abs(t.percent_change || 0).toFixed(1)}%
                            </span>
                        ` : '<span>🆕 Новый</span>'}
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // Рендеринг сравнения
        function renderCompare(data) {
            const container = document.getElementById('compare-list');
            
            if (!data?.length) {
                container.innerHTML = '<div class="empty">🏪 Нет данных для сравнения</div>';
                return;
            }
            
            const html = data.map(c => `
                <div class="comparison-card">
                    <div class="comparison-header">🛒 ${c.product_name}</div>
                    ${c.stores.map(s => `
                        <div class="store-price ${s.store_name === c.cheapest_store ? 'best' : ''}">
                            <span>
                                ${s.store_name === c.cheapest_store ? '🏆' : '🏪'} 
                                ${s.store_name}
                            </span>
                            <strong>${s.price.toFixed(0)} ₲</strong>
                        </div>
                    `).join('')}
                    <div style="margin-top:10px; text-align:center; font-size:12px; opacity:0.7">
                        💰 Разница: ${c.price_difference.toFixed(0)} ₲ 
                        (${c.savings_potential.toFixed(1)}%)
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // Переключение табов
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'trends' && !trendsData.length) {
                loadTrends(currentDays);
            } else if (tab === 'compare' && !compareData.length) {
                loadCompare();
            }
            
            tg.HapticFeedback.impactOccurred('light');
        }
        
        // Фильтр трендов
        function filterTrends(days) {
            currentDays = days;
            
            document.querySelectorAll('.filters .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadTrends(days);
            tg.HapticFeedback.impactOccurred('light');
        }
        
        // Поиск трендов
        let searchTrendsTimeout;
        function searchTrends(query) {
            clearTimeout(searchTrendsTimeout);
            searchTrendsTimeout = setTimeout(() => {
                loadTrends(currentDays, query || null);
            }, 500);
        }
        
        // Поиск сравнения
        let searchCompareTimeout;
        function searchCompare(query) {
            clearTimeout(searchCompareTimeout);
            searchCompareTimeout = setTimeout(() => {
                loadCompare(query || null);
            }, 500);
        }
        
        // Утилиты
        function formatMoney(amount) {
            if (!amount) return '0 ₲';
            if (amount >= 1000000) return `${(amount / 1000000).toFixed(1)}M ₲`;
            if (amount >= 1000) return `${(amount / 1000).toFixed(0)}K ₲`;
            return `${Math.round(amount).toLocaleString('ru-RU')} ₲`;
        }
        
        function showLoading(id) {
            document.getElementById(id).innerHTML = '<div class="loading">⏳ Загрузка...</div>';
        }
        
        function showError(id, msg) {
            document.getElementById(id).innerHTML = `<div class="error">❌ ${msg}</div>`;
        }
        
        // Запуск
        init();
        
        // Main Button
        tg.MainButton.setText('🔄 Обновить');
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            api.clearCache();
            init();
            tg.HapticFeedback.impactOccurred('medium');
        });
    </script>
</body>
</html>

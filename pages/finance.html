<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="finance.title">Финансы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="finance.title">Финансы</span></h1>
    <p data-i18n="finance.subtitle">Управление расходами и аналитика</p>
</div>

<div class="monthly-summary">
    <div class="monthly-summary-header" data-i18n="monthlyStats.title">💰 Расходы за текущий месяц</div>
    <div class="monthly-summary-amount" id="monthly-total">-</div>
    <div class="monthly-summary-details">
        <span>📅 <span id="monthly-period">-</span></span>
        <span>🧾 <span id="monthly-purchases">-</span> <span data-i18n="monthlyStats.purchases">покупок</span></span>
    </div>
</div>

<div class="quick-actions">
    <div class="action-buttons">
        <div class="action-btn" onclick="openModule('add-expense')">
            💳 <span data-i18n="actions.addExpense">Добавить расход</span>
        </div>
        <div class="action-btn" onclick="openModule('products')">
            📦 <span data-i18n="actions.management">Управление</span>
        </div>
        <div class="action-btn" onclick="openModule('budget')">
            📊 <span data-i18n="actions.priceAnalysis">Анализ цен</span>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/home.js"></script>
<script src="../js/i18n/monthly-stats.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/finance.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="monthly.title">Расходы за текущий месяц</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/monthly-stats.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="monthly.title">Расходы за текущий месяц</span></h1>
    <div class="month-navigation">
        <button class="nav-btn" onclick="previousMonth()">◀</button>
        <div id="period-display" class="period-display">-</div>
        <button class="nav-btn" onclick="nextMonth()">▶</button>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label" data-i18n="monthly.totalSpent">Всего потрачено</div>
        <div class="stat-value" id="total-spent">0 ₲</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Средний чек</div>
        <div class="stat-value" id="avg-purchase">0 ₲</div>
    </div>
    <div class="stat-card">
        <div class="stat-label" data-i18n="monthly.purchases">Покупок</div>
        <div class="stat-value" id="total-purchases">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label" data-i18n="monthly.stores">Магазинов</div>
        <div class="stat-value" id="unique-stores">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Позиций</div>
        <div class="stat-value" id="total-items">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Товаров</div>
        <div class="stat-value" id="unique-products">0</div>
    </div>
</div>

<div class="section">
    <h2>📊 По дням</h2>
    <div id="daily-chart"></div>
</div>

<div class="section">
    <h2 data-i18n="monthly.topCategories">Топ категорий</h2>
    <div id="categories-list"></div>
</div>

<div class="section">
    <h2 data-i18n="monthly.topStores">Топ магазинов</h2>
    <div id="stores-list"></div>
</div>

<div class="section">
    <h2>🛒 Крупнейшие покупки</h2>
    <div id="purchases-list"></div>
</div>

<div class="section">
    <h2>📅 По дням недели</h2>
    <div id="weekday-stats"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/monthly-stats.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="budget.title">Покупки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/budget.css">
    <link rel="stylesheet" href="../css/receipt-modal.css">
    <link rel="stylesheet" href="../css/recent-receipts.css">
    <link rel="stylesheet" href="../css/back-button.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="budget.title">Покупки в супермаркетах</span></h1>
    <p data-i18n="budget.subtitle">Анализ цен и экономия</p>
</div>

<!-- Баннер месячных расходов -->
<div id="monthly-banner-container"></div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">📊 <span data-i18n="budget.tabOverview">Обзор</span></div>
    <div class="tab" onclick="switchTab('trends')">📈 <span data-i18n="budget.tabTrends">Тренды</span></div>
    <div class="tab" onclick="switchTab('compare')">🏪 <span data-i18n="budget.tabCompare">Сравнение</span></div>
</div>

<!-- Обзор -->
<div id="tab-overview" class="content active">
    <div class="stats">
        <div class="stat">
            <div class="value" id="total">-</div>
            <div class="label" data-i18n="budget.expenses">Расходы</div>
        </div>
        <div class="stat">
            <div class="value" id="purchases">-</div>
            <div class="label" data-i18n="budget.purchasesCount">Покупок</div>
        </div>
        <div class="stat">
            <div class="value" id="products">-</div>
            <div class="label" data-i18n="budget.productsCount">Товаров</div>
        </div>
        <div class="stat">
            <div class="value" id="stores">-</div>
            <div class="label" data-i18n="budget.recipients">Получателей</div>
        </div>
    </div>

    <!-- Контейнер для последних чеков -->
    <div id="recent-receipts-container"></div>
</div>

<!-- Тренды -->
<div id="tab-trends" class="content">
    <div class="filters">
        <button class="filter-btn active" onclick="filterTrends(7)" data-i18n="budget.filter7days">7 дней</button>
        <button class="filter-btn" onclick="filterTrends(30)" data-i18n="budget.filter30days">30 дней</button>
        <button class="filter-btn" onclick="filterTrends(90)" data-i18n="budget.filter90days">90 дней</button>
    </div>

    <div class="search">
        <input type="text" id="trends-search" data-i18n-target="placeholder" data-i18n="budget.searchProduct" placeholder="🔍 Поиск товара..." onkeyup="searchTrends(this.value)">
    </div>

    <div id="trends-list"></div>
</div>

<!-- Сравнение -->
<div id="tab-compare" class="content">
    <div class="search">
        <input type="text" id="compare-search" data-i18n-target="placeholder" data-i18n="budget.searchProduct" placeholder="🔍 Поиск товара..." onkeyup="searchCompare(this.value)">
    </div>

    <div id="compare-list"></div>
</div>

<!-- Модульная система i18n -->
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/budget.js"></script>
<script src="../js/i18n-page-loader.js"></script>

<!-- Общие утилиты -->
<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>

<!-- Компоненты -->
<script src="../js/components/back-button.js"></script>
<script src="../js/components/monthly-banner.js"></script>
<script src="../js/components/receipt-modal.js"></script>
<script src="../js/components/recent-receipts.js"></script>

<!-- Основная логика страницы -->
<script src="../js/budget.js"></script>

<script>
// ✅ Универсальная инициализация с компонентом кнопки "Назад"
async function initBudgetPage() {
    console.log('💰 Загрузка страницы покупок...');

    // Инициализируем валюту
    if (typeof initCurrency === 'function') {
        await initCurrency();
    }

    // ✅ Инициализируем компонент кнопки "Назад" с правильной логикой
    if (window.BackButton && typeof window.BackButton.init === 'function') {
        // Определяем fallback URL в зависимости от текущей страницы
        let fallbackUrl = '../index.html';

        // Пытаемся определить откуда пришли
        if (document.referrer) {
            try {
                const referrer = new URL(document.referrer);
                const current = new URL(window.location.href);

                // Если пришли не с той же страницы, используем referrer как fallback
                if (referrer.pathname !== current.pathname) {
                    fallbackUrl = document.referrer;
                }
            } catch (e) {
                console.log('🔙 Не удалось разобрать referrer:', e);
            }
        }

        // Настраиваем кнопку "Назад" для возврата на предыдущую страницу
        window.BackButton.setFallbackUrl(fallbackUrl);
        window.BackButton.init();

        console.log('🔙 Компонент BackButton инициализирован');
        console.log(`🔙 Fallback URL: ${fallbackUrl}`);
    } else {
        console.error('🔙 Компонент BackButton не найден');

        // Fallback: используем стандартную кнопку Telegram если доступна
        const tg = window.Telegram?.WebApp;
        if (tg?.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '../index.html';
                }
            });
        }
    }

    // Инициализируем баннер
    if (window.monthlyBanner) {
        await window.monthlyBanner.init();
    }

    // ✅ Инициализируем компонент последних чеков
    if (window.recentReceipts) {
        await window.recentReceipts.init();
    }

    // Инициализируем основную логику budget.js
    if (typeof init === 'function') {
        try {
            // Вызываем init из budget.js
            await init();
        } catch (error) {
            console.error('Ошибка при инициализации budget.js:', error);
        }
    }

    // Проверяем наличие Telegram Web App
    if (window.Telegram?.WebApp) {
        console.log('✅ Telegram Web App доступен');
    }
}

// Запускаем инициализацию при загрузке DOM
document.addEventListener('DOMContentLoaded', initBudgetPage);

// Обработчик ошибок
window.addEventListener('error', function(e) {
    console.error('Глобальная ошибка:', e.error);
});

// Дополнительная обработка для истории браузера
window.addEventListener('pageshow', function(event) {
    console.log('🔙 Страница показана (pageshow), persisted:', event.persisted);
});

window.addEventListener('popstate', function(event) {
    console.log('🔙 Событие popstate:', event.state);
});
</script>

</body>
</html>

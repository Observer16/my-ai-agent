<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Активность</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="header">
    <h1>🏃 Физическая активность</h1>
    <p>Трекер тренировок и активности</p>
</div>

<div class="stats">
    <div class="stat">
        <div class="value" id="steps-today">-</div>
        <div class="label">Шаги сегодня</div>
    </div>
    <div class="stat">
        <div class="value" id="workouts-week">-</div>
        <div class="label">Тренировок неделя</div>
    </div>
    <div class="stat">
        <div class="value" id="calories-today">-</div>
        <div class="label">Калорий сегодня</div>
    </div>
</div>

<div class="section-title">📊 Тренировки</div>
<div id="workouts-list"></div>

<div class="empty" style="margin-top: 100px;">
    <div style="font-size: 64px; margin-bottom: 20px;">🏗️</div>
    <h3>Модуль в разработке</h3>
    <p>Скоро здесь будет полноценный трекер активности</p>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/api.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = '../index.html');

    document.getElementById('steps-today').textContent = '0';
    document.getElementById('workouts-week').textContent = '0';
    document.getElementById('calories-today').textContent = '0';
</script>
</body>
</html>

<!-- components/health-medications.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<div class="health-medications">
    <!-- Заголовок и действия -->
    <div class="medications-header">
        <h2 data-i18n="health.medications.title">💊 Аптечка</h2>
        <div class="medications-actions">
            <button id="toggle-archive" class="health-btn btn-secondary" data-i18n="health.medications.archive">
                Архив
            </button>
            <button id="add-medication-btn" class="health-btn btn-primary" data-i18n="health.medications.add_medication">
                + Добавить
            </button>
        </div>
    </div>

    <!-- Список лекарств -->
    <div id="medications-list">
        <div class="loading-spinner"></div>
        <p data-i18n="health.medications.loading_medications">Загрузка лекарств...</p>
    </div>

    <!-- Пояснение -->
    <div class="health-card" style="margin-top: 24px;">
        <h3 data-i18n="health.medications.how_it_works">💡 Как это работает?</h3>
        <p style="margin-bottom: 12px; color: var(--health-text-light);">
            Добавляйте лекарства, которые принимаете регулярно. Вы можете указать:
        </p>
        <ul style="color: var(--health-text-light); padding-left: 20px; margin: 0;">
            <li>Название и дозировку</li>
            <li>Форму выпуска (таблетки, капсулы и т.д.)</li>
            <li>Расписание приема</li>
            <li>Инструкции по применению</li>
        </ul>
    </div>
</div>

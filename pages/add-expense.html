<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="expense.title">Добавить расход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Quagga.js - лучшая библиотека для штрих-кодов (не QR) -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

    <!-- Подключаем внешний CSS файл -->
    <link rel="stylesheet" href="../css/add-expense.css">
</head>
<body>
<div class="header">
    <h1 data-i18n="expense.title">Добавить расход</h1>
    <p data-i18n="expense.subtitle">Ручное внесение покупки</p>
</div>

<div class="form">
    <div class="form-group">
        <label class="form-label"><span data-i18n="expense.recipient">Получатель</span> *</label>
        <div class="custom-select-wrapper">
            <div class="custom-select" id="store-display" onclick="toggleStoreList()">
                <span id="store-display-text" data-i18n="expense.selectRecipient">Выберите получателя...</span>
            </div>
            <span class="custom-select-arrow">▼</span>
            <div class="store-list" id="store-list"></div>
        </div>
        <input type="hidden" id="selected-store-id">
        <a href="#" class="create-link" onclick="showCreateStore(event)">+ <span data-i18n="expense.createRecipient">Создать нового получателя</span></a>
    </div>

    <div class="form-group">
        <label class="form-label"><span data-i18n="expense.product">Товар</span> *</label>
        <div class="search-tabs">
            <div class="search-tab active" onclick="switchSearchMode('name', this)" data-i18n="expense.searchByName">По названию</div>
            <div class="search-tab" onclick="switchSearchMode('barcode', this)" data-i18n="expense.searchByBarcode">По штрих-коду</div>
        </div>

        <div id="search-by-name">
            <input type="text" class="form-input" id="product-search"
                   data-i18n-target="placeholder" data-i18n="expense.startTyping"
                   placeholder="Начните вводить название..."
                   oninput="searchProducts(this.value)">
        </div>

        <div id="search-by-barcode" style="display: none;">
            <div class="barcode-input-wrapper">
                <input type="text" class="form-input" id="barcode-search"
                       data-i18n-target="placeholder" data-i18n="expense.enterBarcode"
                       placeholder="Введите штрих-код..."
                       oninput="searchByBarcode(this.value)"
                       inputmode="numeric">
                <button class="scan-btn" onclick="openScanner()" data-i18n="expense.photo">Фото</button>
            </div>
        </div>

        <div class="search-results" id="product-results"></div>

        <div class="selected-product-info" id="selected-product-info">
            <span class="selected-product-clear" onclick="clearSelectedProduct()">✕</span>
            <div class="selected-product-name" id="selected-product-display-name">-</div>
            <div class="selected-product-details" id="selected-product-display-details">-</div>
        </div>

        <a href="#" class="create-link" onclick="showCreateProduct(event)">+ <span data-i18n="expense.createProduct">Создать новый товар</span></a>
    </div>

    <input type="hidden" id="selected-product-id">
    <input type="hidden" id="selected-product-name">
    <input type="hidden" id="selected-product-barcode">

    <div class="barcode-field" id="add-barcode-field">
        <div class="form-group">
            <label class="form-label" data-i18n="expense.addBarcodeToProduct">Добавить штрих-код к товару</label>
            <div class="barcode-input-wrapper">
                <input type="text" class="form-input" id="new-barcode" 
                       data-i18n-target="placeholder" data-i18n="expense.enterBarcode"
                       placeholder="Введите штрих-код..."
                       inputmode="numeric">
                <button class="scan-btn" onclick="openScannerForNewBarcode()" data-i18n="expense.photo">Фото</button>
            </div>
        </div>
    </div>

    <div class="toggle-container">
        <span class="toggle-label" data-i18n="expense.weighted">Весовой товар</span>
        <div class="toggle-switch" id="weight-toggle" onclick="toggleWeightMode()"></div>
    </div>

    <div class="form-group" id="unit-selector-group" style="display: none;">
        <label class="form-label" data-i18n="expense.unit">Единица измерения</label>
        <div class="unit-selector">
            <div class="unit-btn active" onclick="selectUnit('kg', this)" data-i18n="expense.kg">кг</div>
            <div class="unit-btn" onclick="selectUnit('g', this)" data-i18n="expense.g">грамм</div>
            <div class="unit-btn" onclick="selectUnit('l', this)" data-i18n="expense.l">литр</div>
            <div class="unit-btn" onclick="selectUnit('ml', this)" data-i18n="expense.ml">мл</div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label class="form-label" id="quantity-label"><span data-i18n="expense.quantity">Количество</span> *</label>
            <input type="number" class="form-input" id="quantity" value="1" min="0.001" step="1"
                   onchange="updateSummary()" oninput="updateSummary()">
        </div>
        <div class="form-group" id="unit-price-group">
            <label class="form-label" id="price-label"><span data-i18n="expense.pricePerUnit">Цена за ед.</span> *</label>
            <input type="number" class="form-input" id="unit-price" min="0" step="1" placeholder="0"
                   onchange="updatePriceFromUnit()" oninput="updatePriceFromUnit()">
        </div>
        <div class="form-group" id="total-price-group" style="display: none;">
            <label class="form-label"><span data-i18n="expense.totalAmount">Общая сумма</span> *</label>
            <input type="number" class="form-input" id="total-price" min="0" step="1" placeholder="0"
                   onchange="updatePriceFromTotal()" oninput="updatePriceFromTotal()">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" data-i18n="expense.purchaseDate">Дата покупки</label>
        <input type="date" class="form-input" id="purchase-date">
    </div>

    <div class="summary">
        <div class="summary-row"><span data-i18n="expense.product">Товар:</span><span id="summary-product">-</span></div>
        <div class="summary-row"><span data-i18n="expense.recipient">Получатель:</span><span id="summary-store">-</span></div>
        <div class="summary-row"><span data-i18n="expense.quantity">Количество:</span><span id="summary-quantity">-</span></div>
        <div class="summary-row total"><span data-i18n="expense.total">Итого:</span><span id="summary-total">-</span></div>
    </div>
</div>

<!-- СКАНЕР -->
<div class="scanner-modal" id="scanner-modal">
    <div class="scanner-header">
        <h3 data-i18n="expense.scanner">Сканер штрих-кода</h3>
        <button class="scanner-close" onclick="closeScanner()">✕</button>
    </div>

    <div class="scanner-body">
        <!-- Контейнер для Quagga.js -->
        <div id="scanner-video-container"></div>

        <!-- Визуальная подсказка -->
        <div class="scanner-guide">
            <div class="scanner-frame-guide"></div>
            <div class="scanner-hint-text" data-i18n="expense.aimAtBarcode">Наведите на штрих-код</div>
        </div>
    </div>

    <div class="scanner-bottom">
        <div class="scanner-result" id="scanner-result">
            <div data-i18n="expense.codeFound">Найден код:</div>
            <div class="scanner-result-code" id="scanned-code">-</div>
        </div>

        <div class="scanner-buttons" id="scanner-buttons-found" style="display: none;">
            <button class="scanner-btn secondary" onclick="rescanBarcode()" data-i18n="expense.tryAgain">Ещё раз</button>
            <button class="scanner-btn primary" onclick="useScannedBarcode()" data-i18n="expense.use">Использовать</button>
        </div>

        <div class="scanner-buttons" id="scanner-buttons-default">
            <button class="scanner-btn secondary" onclick="closeScanner()" data-i18n="common.cancel">Отмена</button>
        </div>

        <div class="scanner-manual">
            <input type="text" id="manual-barcode" 
                   data-i18n-target="placeholder" data-i18n="expense.orEnterManually"
                   placeholder="Или введите вручную..." 
                   inputmode="numeric">
            <button onclick="useManualBarcode()">OK</button>
        </div>

        <div class="scanner-status" id="scanner-status" data-i18n="expense.initializing">Инициализация...</div>
    </div>
</div>

<!-- NEW: Модульная система i18n -->
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/expense.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<!-- END: i18n -->
<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>
<script src="../js/add-expense.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дневник здоровья</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/health.css">
</head>
<body>

<!-- ХЕДЕР -->
<div class="header">
    <h1>💪 Дневник здоровья</h1>
    <p id="current-date"></p>
</div>

<!-- БЫСТРАЯ ОЦЕНКА СЕГОДНЯ -->
<div class="quick-log-section" id="quick-log-section">
    <h3>Как вы себя чувствуете сегодня?</h3>
    <div class="feeling-buttons">
        <button class="feeling-btn" data-value="1" onclick="quickLog(1)">😢</button>
        <button class="feeling-btn" data-value="2" onclick="quickLog(2)">😕</button>
        <button class="feeling-btn" data-value="3" onclick="quickLog(3)">😐</button>
        <button class="feeling-btn" data-value="4" onclick="quickLog(4)">🙂</button>
        <button class="feeling-btn" data-value="5" onclick="quickLog(5)">😊</button>
    </div>
</div>

<!-- СТАТИСТИКА -->
<div class="stats-section" id="stats-section">
    <div class="stat-card">
        <div class="stat-icon">😊</div>
        <div class="stat-value" id="avg-feeling">-</div>
        <div class="stat-label">Средняя оценка</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="total-entries">-</div>
        <div class="stat-label">Записей за месяц</div>
    </div>
</div>

<!-- ИСТОРИЯ ЗАПИСЕЙ -->
<div class="history-section">
    <h3>История записей</h3>
    <div id="entries-list" class="entries-list"></div>
</div>

<!-- КНОПКА "ПОДРОБНАЯ ЗАПИСЬ" -->
<button class="btn-detailed" onclick="openDetailedForm()">
    ➕ Подробная запись
</button>

<!-- МОДАЛЬНОЕ ОКНО ПОДРОБНОЙ ФОРМЫ -->
<div class="modal" id="detailed-modal">
    <div class="modal-content">
        <h2>Подробная оценка</h2>

        <label>Общее самочувствие *</label>
        <div class="rating-scale" id="overall-feeling"></div>

        <label>Уровень энергии</label>
        <div class="rating-scale" id="energy-level"></div>

        <label>Качество сна</label>
        <div class="rating-scale" id="sleep-quality"></div>

        <label>Уровень стресса</label>
        <div class="rating-scale" id="stress-level"></div>

        <label>Симптомы (необязательно)</label>
        <div class="symptoms-chips" id="symptoms-chips"></div>

        <label>Заметки</label>
        <textarea id="notes" placeholder="Дополнительные заметки..."></textarea>

        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeDetailedForm()">Отмена</button>
            <button class="btn-save" onclick="saveDetailedEntry()">Сохранить</button>
        </div>
    </div>
</div>

<!-- ✅ ПРАВИЛЬНЫЙ ПОРЯДОК ПОДКЛЮЧЕНИЯ СКРИПТОВ -->
<script src="../js/config.js"></script>        <!-- 1. Конфигурация -->
<script src="../js/api.js"></script>           <!-- 2. Базовый API -->
<script src="../js/health-api.js"></script>    <!-- 3. Health API (НОВЫЙ!) -->
<script src="../js/health.js"></script>        <!-- 4. Логика страницы -->

</body>
</html>

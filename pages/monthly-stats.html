<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Статистика за месяц</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/monthly-stats.css">
</head>
<body>
<div class="header">
    <h1>📊 Статистика за месяц</h1>
    <p>Детальный анализ расходов</p>
</div>

<div class="period-selector">
    <button class="period-nav-btn" onclick="previousMonth()">←</button>
    <div class="period-display" id="period-display">-</div>
    <button class="period-nav-btn" onclick="nextMonth()">→</button>
</div>

<div class="summary-grid">
    <div class="summary-card">
        <div class="summary-value" id="total-spent">-</div>
        <div class="summary-label">Всего потрачено</div>
    </div>
    <div class="summary-card">
        <div class="summary-value" id="avg-purchase">-</div>
        <div class="summary-label">Средний чек</div>
    </div>
    <div class="summary-card">
        <div class="summary-value" id="total-purchases">-</div>
        <div class="summary-label">Покупок</div>
    </div>
    <div class="summary-card">
        <div class="summary-value" id="unique-stores">-</div>
        <div class="summary-label">Получателей</div>
    </div>
    <div class="summary-card">
        <div class="summary-value" id="total-items">-</div>
        <div class="summary-label">Товаров</div>
    </div>
    <div class="summary-card">
        <div class="summary-value" id="unique-products">-</div>
        <div class="summary-label">Уникальных товаров</div>
    </div>
</div>

<div class="section">
    <div class="section-title">📈 Расходы по дням</div>
    <div class="chart-container" id="daily-chart"></div>
</div>

<div class="section">
    <div class="section-title">🏷️ Топ категорий</div>
    <div id="categories-list"></div>
</div>

<div class="section">
    <div class="section-title">🏪 Топ магазинов</div>
    <div id="stores-list"></div>
</div>

<div class="section">
    <div class="section-title">🛒 Крупнейшие покупки</div>
    <div id="purchases-list"></div>
</div>

<div class="section">
    <div class="section-title">📅 Статистика по дням недели</div>
    <div id="weekday-stats"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/api.js"></script>
<script src="../js/monthly-stats.js"></script>
</body>
</html>

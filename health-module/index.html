<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль Здоровья - Мой AI Агент</title>

    <!-- Telegram WebApp SDK -->
    <!--<script src="https://telegram.org/js/telegram-web-app.js"></script> -->

    <!-- ✅ ИСПРАВЛЕНО: Сначала загружаем ГЛАВНУЮ конфигурацию проекта -->
    <!--<script src="../js/config.js"></script> -->

    <!-- Подключаем стили модуля -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/health-styles.css">
    <link rel="stylesheet" href="css/health-components.css">
</head>
<body>
<!-- Навигация модуля -->
<div class="health-navigation">
    <div class="health-tabs" id="health-tabs">
        <div class="health-tab active" data-tab="dashboard">
            <span class="tab-icon">🏠</span>
            <span class="tab-text">Сегодня</span>
        </div>
        <div class="health-tab" data-tab="medications">
            <span class="tab-icon">💊</span>
            <span class="tab-text">Аптечка</span>
        </div>
        <div class="health-tab" data-tab="diary">
            <span class="tab-icon">📖</span>
            <span class="tab-text">Дневник</span>
        </div>
        <div class="health-tab" data-tab="stats">
            <span class="tab-icon">📊</span>
            <span class="tab-text">Статистика</span>
        </div>
    </div>
</div>

<!-- Контейнер для контента -->
<div class="health-container" id="health-container">
    <!-- Контент загружается динамически -->
    <div class="health-loading" id="health-loading">
        <div class="loading-spinner"></div>
        <p>Загрузка модуля здоровья...</p>
    </div>
</div>

<!-- Модальные окна -->
<div id="health-modals"></div>

<!-- ✅ ПРАВИЛЬНЫЙ ПОРЯДОК ЗАГРУЗКИ -->

<!-- 1. Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- 2. ГЛАВНАЯ конфигурация проекта (только ОДИН раз!) -->
<script src="../js/config.js"></script>

<!-- 3. Стили модуля -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/health-styles.css">
<link rel="stylesheet" href="css/health-components.css">

<!-- 4. Конфиг модуля (НЕ constants/config.js!) -->
<script src="js/config.js"></script>

<!-- 5. Storage и API -->
<script src="js/health-storage.js"></script>
<script src="js/health-api.js"></script>
<script src="js/health-ui.js"></script>

<!-- 6. Core модули -->
<script src="core/state-manager.js"></script>
<script src="core/dom-manager.js"></script>
<script src="core/event-manager.js"></script>

<!-- 7. Utils -->
<script src="utils/component-loader.js"></script>
<script src="utils/error-handler.js"></script>
<script src="utils/storage-helper.js"></script>
<script src="utils/ui-helpers.js"></script>

<!-- 8. Managers -->
<script src="managers/onboarding-manager.js"></script>
<script src="managers/tab-manager.js"></script>
<script src="managers/data-manager.js"></script>

<!-- 9. Tabs -->
<script src="tabs/dashboard-manager.js"></script>
<script src="tabs/medications-manager.js"></script>
<script src="tabs/diary-manager.js"></script>
<script src="tabs/stats-manager.js"></script>

<!-- 10. Главный модуль -->
<script src="js/health-module.js"></script>

<!-- 11. Debug (опционально) -->
<script src="js/health-debug.js"></script>

<!-- Инициализация -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Запуск модуля здоровья...');

        // Проверяем загрузку всех зависимостей
        const dependencies = {
            CONFIG: typeof CONFIG !== 'undefined',
            HealthConfig: typeof HealthConfig !== 'undefined',
            HealthAPI: typeof HealthAPI !== 'undefined',
            HealthUI: typeof HealthUI !== 'undefined',
            HealthModule: typeof HealthModule !== 'undefined',
            Telegram: typeof Telegram !== 'undefined'
        };

        console.log('📋 Проверка зависимостей:', dependencies);

        // Если HealthAPI не загружен - пытаемся загрузить вручную
        if (!dependencies.HealthAPI) {
            console.error('❌ HealthAPI не загружен!');
            showError('Ошибка загрузки модуля здоровья');
            return;
        }

        // Если HealthModule не загружен
        if (!dependencies.HealthModule) {
            console.error('❌ HealthModule не загружен!');
            showError('Ошибка загрузки модуля здоровья');
            return;
        }

        // Функция для быстрой проверки состояния (только если все зависимости загружены)
        if (dependencies.HealthAPI && dependencies.HealthModule) {
            window.checkOnboardingStatus = async function() {
                console.log('=== ПРОВЕРКА СТАТУСА ОНБОРДИНГА ===');

                try {
                    // 1. Проверить API гендера
                    const genderResult = await HealthAPI.getUserGender();
                    console.log('1. API Гендер:', {
                        success: genderResult.success,
                        gender: genderResult.data?.gender,
                        raw: genderResult
                    });

                    // 2. Проверить состояние модуля
                    const state = HealthModule.getState();
                    console.log('2. Состояние модуля:', {
                        userGender: state.userGender,
                        isOnboarding: state.isOnboarding,
                        isLoading: state.isLoading
                    });

                    // 3. Проверить localStorage
                    console.log('3. localStorage:', {
                        gender: localStorage.getItem('health_user_gender'),
                        allKeys: Object.keys(localStorage).filter(k => k.includes('health'))
                    });

                } catch (error) {
                    console.error('❌ Ошибка проверки статуса:', error);
                }
            };
        }

        // Функция показа ошибки
        function showError(message) {
            const container = document.getElementById('health-container');
            if (container) {
                container.innerHTML = `
                    <div class="health-error-message">
                        <div class="error-icon">⚠️</div>
                        <div class="error-text">
                            <h3>Ошибка загрузки модуля</h3>
                            <p>${message}</p>
                            <button onclick="location.reload()" class="health-btn btn-primary">
                                Перезагрузить
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        try {
            // Инициализация модуля
            HealthModule.init().catch(error => {
                console.error('💥 Ошибка инициализации модуля:', error);
                showError(error.message || 'Неизвестная ошибка');
            });

        } catch (error) {
            console.error('💥 Критическая ошибка запуска:', error);
            showError('Критическая ошибка загрузки модуля');
        }

        // Автоматически проверить статус через 3 секунды
        setTimeout(() => {
            if (window.checkOnboardingStatus && typeof HealthAPI !== 'undefined') {
                window.checkOnboardingStatus();
            }
        }, 3000);
    });
</script>
</body>
</html>

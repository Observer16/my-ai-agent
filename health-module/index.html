<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль Здоровья - Мой AI Агент</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ✅ ИСПРАВЛЕНО: Сначала загружаем ГЛАВНУЮ конфигурацию проекта -->
    <script src="../js/config.js"></script>

    <!-- Подключаем стили модуля -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/health-styles.css">
    <link rel="stylesheet" href="css/health-components.css">
</head>
<body>
    <!-- Навигация модуля -->
    <div class="health-navigation">
        <div class="health-tabs" id="health-tabs">
            <div class="health-tab active" data-tab="dashboard">
                <span class="tab-icon">🏠</span>
                <span class="tab-text">Сегодня</span>
            </div>
            <div class="health-tab" data-tab="medications">
                <span class="tab-icon">💊</span>
                <span class="tab-text">Аптечка</span>
            </div>
            <div class="health-tab" data-tab="diary">
                <span class="tab-icon">📖</span>
                <span class="tab-text">Дневник</span>
            </div>
            <div class="health-tab" data-tab="stats">
                <span class="tab-icon">📊</span>
                <span class="tab-text">Статистика</span>
            </div>
        </div>
    </div>

    <!-- Контейнер для контента -->
    <div class="health-container" id="health-container">
        <!-- Контент загружается динамически -->
        <div class="health-loading" id="health-loading">
            <div class="loading-spinner"></div>
            <p>Загрузка модуля здоровья...</p>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="health-modals"></div>

    <!-- ✅ ИСПРАВЛЕНО: Правильный порядок загрузки JS модуля -->
    <!-- 1. Сначала конфиг модуля (использует глобальный CONFIG) -->
    <script src="js/config.js"></script>
    <!-- 2. Затем storage -->
    <script src="js/health-storage.js"></script>
    <!-- 3. Затем API (использует HealthConfig) -->
    <script src="js/health-api.js"></script>
    <!-- 4. Затем UI -->
    <script src="js/health-ui.js"></script>
    <!-- 5. Затем основной модуль -->
    <script src="js/health-module.js"></script>
    <!-- 6. Опционально debug -->
    <script src="js/health-debug.js"></script>

    <!-- Инициализация -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Запуск модуля здоровья...');

            // ✅ Проверяем загрузку конфигурации
            console.log('📋 Проверка конфигурации:');
            console.log('  - CONFIG:', typeof CONFIG !== 'undefined' ? CONFIG.API_URL : 'НЕ ЗАГРУЖЕН');
            console.log('  - HealthConfig:', typeof HealthConfig !== 'undefined' ? HealthConfig.API_URL : 'НЕ ЗАГРУЖЕН');

            // Включаем режим отладки если в URL есть параметр
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('debug') || (typeof CONFIG !== 'undefined' && CONFIG.DEBUG)) {
                if (typeof HealthConfig !== 'undefined') {
                    HealthConfig.DEBUG = true;
                }
                console.log('🔧 Режим отладки включен');
            }

            // ✅ Проверяем что HealthAPI загружен и работает
            if (typeof HealthAPI !== 'undefined') {
                console.log('✅ HealthAPI загружен')
            } else {
                console.error('❌ HealthAPI НЕ загружен!');
            }

            // Инициализируем модуль
            if (typeof HealthModule !== 'undefined') {
                HealthModule.init().catch(error => {
                    console.error('💥 Критическая ошибка инициализации:', error);
                    document.getElementById('health-container').innerHTML = `
                        <div class="health-error-message">
                            <div class="error-icon">⚠️</div>
                            <div class="error-text">
                                <h3>Ошибка загрузки модуля</h3>
                                <p>${error.message}</p>
                                <button onclick="location.reload()" class="health-btn btn-primary" style="margin-top: 10px;">
                                    Перезагрузить
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                console.error('❌ HealthModule НЕ загружен!');
            }
        });
    </script>
</body>
</html>

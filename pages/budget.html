<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Подключаем внешний CSS файл -->
    <link rel="stylesheet" href="../css/budget.css">
</head>
<body>
<div class="header">
    <h1>💰 Покупки в супермаркетах</h1>
    <p>Анализ цен и экономия</p>
</div>

<!-- Баннер месячных расходов -->
<div class="monthly-banner" id="monthly-banner" onclick="openMonthlyStats()">
    <div class="monthly-banner-header">
        <span>💰 Расходы за текущий месяц</span>
        <span class="monthly-banner-arrow">→</span>
    </div>
    <div class="monthly-banner-amount" id="monthly-banner-amount">-</div>
    <div class="monthly-banner-details">
        <span>📅 <span id="monthly-banner-period">-</span></span>
        <span>🧾 <span id="monthly-banner-purchases">-</span> покупок</span>
        <span>🏪 <span id="monthly-banner-stores">-</span> магазинов</span>
    </div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">📊 Обзор</div>
    <div class="tab" onclick="switchTab('trends')">📈 Тренды</div>
    <div class="tab" onclick="switchTab('compare')">🏪 Сравнение</div>
</div>

<!-- Обзор -->
<div id="tab-overview" class="content active">
    <div class="stats">
        <div class="stat">
            <div class="value" id="total">-</div>
            <div class="label">Расходы</div>
        </div>
        <div class="stat">
            <div class="value" id="purchases">-</div>
            <div class="label">Покупок</div>
        </div>
        <div class="stat">
            <div class="value" id="products">-</div>
            <div class="label">Товаров</div>
        </div>
        <div class="stat">
            <div class="value" id="stores">-</div>
            <div class="label">Магазинов</div>
        </div>
    </div>

    <div class="section-title">🧾 Последние чеки</div>
    <div id="recent-receipts"></div>
</div>

<!-- Тренды -->
<div id="tab-trends" class="content">
    <div class="filters">
        <button class="filter-btn active" onclick="filterTrends(7)">7 дней</button>
        <button class="filter-btn" onclick="filterTrends(30)">30 дней</button>
        <button class="filter-btn" onclick="filterTrends(90)">90 дней</button>
    </div>

    <div class="search">
        <input type="text" placeholder="🔍 Поиск товара..." onkeyup="searchTrends(this.value)">
    </div>

    <div id="trends-list"></div>
</div>

<!-- Сравнение -->
<div id="tab-compare" class="content">
    <div class="search">
        <input type="text" placeholder="🔍 Поиск товара..." onkeyup="searchCompare(this.value)">
    </div>

    <div id="compare-list"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = '../index.html');

    let currentDays = 7;
    let trendsData = [];
    let compareData = [];

    // Инициализация
    async function init() {
        try {
            await loadOverview();
            await loadMonthlyBanner();
            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Init error:', error);
        }
    }

    // Загрузка баннера месячных расходов
    async function loadMonthlyBanner() {
        try {
            const stats = await API.getMonthlyStatistics();

            // Форматируем сумму
            document.getElementById('monthly-banner-amount').textContent = formatMoney(stats.summary.total_spent);

            // Период
            const now = new Date();
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                               'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            document.getElementById('monthly-banner-period').textContent = monthNames[now.getMonth()];

            // Количество покупок
            document.getElementById('monthly-banner-purchases').textContent = stats.summary.total_purchases;

            // Количество магазинов
            document.getElementById('monthly-banner-stores').textContent = stats.summary.unique_stores;

        } catch (error) {
            console.error('Ошибка загрузки месячной статистики:', error);
            // Скрываем баннер при ошибке
            document.getElementById('monthly-banner').style.display = 'none';
        }
    }

    // Открыть статистику за месяц
    function openMonthlyStats() {
        tg.HapticFeedback.impactOccurred('medium');
        window.location.href = 'monthly-stats.html';
    }

    // Загрузка обзора
    async function loadOverview() {
        try {
            // Загружаем статистику
            const stats = await API.getStatistics();
            document.getElementById('total').textContent = formatMoney(stats.total_spent);
            document.getElementById('purchases').textContent = stats.total_purchases;
            document.getElementById('products').textContent = stats.unique_products;
            document.getElementById('stores').textContent = stats.unique_stores;

            // Загружаем последние чеки
            await loadRecentReceipts();
        } catch (error) {
            showError('recent-receipts', error.message);
        }
    }

    // Загрузка последних чеков
    async function loadRecentReceipts() {
        showLoading('recent-receipts');
        try {
            const receipts = await API.getRecentPurchases(7);
            renderReceipts(receipts);
        } catch (error) {
            showError('recent-receipts', error.message);
        }
    }

    // Рендеринг последних чеков
    function renderReceipts(receipts) {
        const container = document.getElementById('recent-receipts');

        if (!receipts?.length) {
            container.innerHTML = '<div class="empty">🧾 Нет данных о покупках</div>';
            return;
        }

        const html = receipts.map(r => {
            const date = formatReceiptDate(r.purchase_date);
            const time = formatReceiptTime(r.purchase_date);

            return `
                <div class="receipt-card">
                    <div class="receipt-header">
                        <div>
                            <div class="receipt-store">🏪 ${r.store_name}</div>
                            <div class="receipt-store-type">${r.store_type || 'Магазин'}</div>
                        </div>
                        <div class="receipt-amount">${formatMoney(r.total_amount)}</div>
                    </div>
                    <div class="receipt-info">
                        <span>📅 ${date}</span>
                        <span>🕐 ${time}</span>
                        <span>📦 ${r.items_count} поз.</span>
                        ${r.payment_method ? `<span>💳 ${r.payment_method}</span>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        container.innerHTML = html;
    }

    // Форматирование даты чека
function formatReceiptDate(dateStr) {
if (!dateStr) return '-';

// Парсим UTC дату
const date = new Date(dateStr);
const now = new Date();

// Вычисляем разницу в днях
const diffTime = now - date;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

if (diffDays === 0) return 'Сегодня';
if (diffDays === 1) return 'Вчера';
if (diffDays < 7) return `${diffDays} дн. назад`;

// Форматируем в локальной таймзоне
return date.toLocaleDateString('ru-RU', {
    day: 'numeric',
    month: 'short',
    year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
});
}

function formatReceiptTime(dateStr) {
if (!dateStr) return '-';

const date = new Date(dateStr);

// Форматируем в локальной таймзоне
return date.toLocaleTimeString('ru-RU', {
    hour: '2-digit',
    minute: '2-digit'
});
}

    // Загрузка трендов
    async function loadTrends(days = 7, search = null) {
        showLoading('trends-list');
        try {
            trendsData = await API.getPriceTrends(days, search, 50);
            renderTrends(trendsData, 'trends-list');
        } catch (error) {
            showError('trends-list', error.message);
        }
    }

    // Загрузка сравнения
    async function loadCompare(search = null) {
        showLoading('compare-list');
        try {
            compareData = await API.comparePrices(search, 50);
            renderCompare(compareData);
        } catch (error) {
            console.error('Ошибка загрузки сравнения:', error);

            let errorMessage = 'Произошла ошибка при загрузке данных';

            if (error.message.includes('403') || error.message.includes('Доступ запрещен')) {
                errorMessage = '🔒 Недостаточно прав для просмотра сравнения';
            } else if (error.message.includes('401') || error.message.includes('авторизац')) {
                errorMessage = '🔑 Требуется авторизация в Telegram';
            } else if (error.message) {
                errorMessage = `Ошибка: ${error.message}`;
            }

            showError('compare-list', errorMessage);
        }
    }

    // Рендеринг трендов
    function renderTrends(trends, containerId) {
        const container = document.getElementById(containerId);

        if (!trends?.length) {
            container.innerHTML = '<div class="empty">📊 Нет данных</div>';
            return;
        }

        const html = trends.map(t => `
            <div class="card ${t.trend_direction}">
                <div class="product-name">${t.product_name}</div>
                <div class="store">🏪 ${t.store_name}</div>
                <div class="prices">
                    <span class="price-current">${t.current_price.toFixed(0)} ₲</span>
                    ${t.previous_price ? `
                        <span class="price-old">${t.previous_price.toFixed(0)} ₲</span>
                        <span class="price-change ${t.trend_direction}">
                            ${t.trend_direction === 'up' ? '📈' : '📉'}
                            ${Math.abs(t.percent_change || 0).toFixed(1)}%
                        </span>
                    ` : '<span>🆕 Новый</span>'}
                </div>
            </div>
        `).join('');

        container.innerHTML = html;
    }

    // Функция для точного форматирования
function formatPrice(price) {
    if (!price && price !== 0) return '0 ₲';

    // Если price объект Decimal или число
    const num = typeof price === 'object' && price.toString ?
                parseFloat(price.toString()) :
                Number(price);

    if (isNaN(num)) return '0 ₲';

    // Для целых чисел
    if (Number.isInteger(num)) {
        return num.toLocaleString('ru-RU') + ' ₲';
    }

    // Для чисел с плавающей точкой - 2 знака
    return num.toLocaleString('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + ' ₲';
}

    // Рендеринг сравнения
    function renderCompare(data) {
        const container = document.getElementById('compare-list');

    if (!data?.length) {
        container.innerHTML = `
            <div class="empty">
                <div style="font-size: 48px; margin-bottom: 10px;">🏪</div>
                <div style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">
                    Нет данных для сравнения
                </div>
                <div style="font-size: 13px; opacity: 0.7; line-height: 1.5;">
                    Для сравнения нужны покупки одного товара<br>
                    в разных магазинах
                </div>
            </div>
        `;
        return;
    }

        const html = data.map(c => `
        <div class="comparison-card">
            <div class="comparison-header">🛒 ${c.product_name}</div>
            ${c.stores.map(s => `
        <div class="store-price ${s.store_name === c.cheapest_store ? 'best' : ''}">
            <span>
                ${s.store_name === c.cheapest_store ? '🏆' : '🏪'}
                ${s.store_name}
            </span>
            <strong>${formatPrice(s.price)}</strong>
        </div>
    `).join('')}

        container.innerHTML = html;
    }

    // Переключение табов
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');

        if (tab === 'trends' && !trendsData.length) {
            loadTrends(currentDays);
        } else if (tab === 'compare') {
            loadCompare();  // Всегда загружать при открытии
        }

        tg.HapticFeedback.impactOccurred('light');
    }

    // Фильтр трендов
    function filterTrends(days) {
        currentDays = days;

        document.querySelectorAll('.filters .filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        loadTrends(days);
        tg.HapticFeedback.impactOccurred('light');
    }

    // Поиск трендов
    let searchTrendsTimeout;
    function searchTrends(query) {
        clearTimeout(searchTrendsTimeout);
        searchTrendsTimeout = setTimeout(() => {
            loadTrends(currentDays, query || null);
        }, 500);
    }

    // Поиск сравнения
    let searchCompareTimeout;
    function searchCompare(query) {
        clearTimeout(searchCompareTimeout);
        searchCompareTimeout = setTimeout(() => {
            loadCompare(query || null);
        }, 500);
    }

    // Утилиты

function formatMoney(amount) {
    if (!amount || amount === 0) return '0 ₲';

    // Если число целое, показываем как есть
    if (Number.isInteger(amount)) {
        const absAmount = Math.abs(amount);

        // Для сумм >= 1 000 000 (миллион)
        if (absAmount >= 1000000) {
            const millions = (amount / 1000000).toFixed(1);  // ✅ Исправлено
            return `${millions}M ₲`;
        }
        // Для сумм >= 1 000 (тысяча)
        else if (absAmount >= 1000) {
            const thousands = (amount / 1000).toFixed(1);  // ✅ Исправлено
            return `${thousands}K ₲`;
        }
        // Для сумм < 1 000
        else {
            return `${amount.toLocaleString('ru-RU')} ₲`;
        }
    }

    // Если число с плавающей точкой, показываем с 2 знаками
    const absAmount = Math.abs(amount);

    if (absAmount >= 1000000) {
        const millions = (amount / 1000000).toFixed(1);
        return `${millions}M ₲`;
    }
    else if (absAmount >= 1000) {
        const thousands = (amount / 1000).toFixed(1);
        return `${thousands}K ₲`;
    }
    else {
        // Для маленьких сумм показываем с копейками
        return `${amount.toFixed(2).replace('.', ',')} ₲`;
    }
}

    function showLoading(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <div style="font-size:48px; animation: spin 1s linear infinite;">⏳</div>
                <div style="margin-top:10px; opacity:0.7;">Загрузка...</div>
            </div>
        `;
    }

    function showError(containerId, message) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div class="empty">
                <div style="font-size:48px; margin-bottom:10px;">⚠️</div>
                <div>${message}</div>
            </div>
        `;
    }


    // Запуск
    init();

    // Main Button
    tg.MainButton.setText('🔄 Обновить');
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
        api.clearCache();
        init();
        tg.HapticFeedback.impactOccurred('medium');
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="monthly.title">Расходы за текущий месяц</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/monthly-stats.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="monthly.title">Расходы за текущий месяц</span></h1>
</div>

<div class="stats-card">
    <div class="stats-title" data-i18n="monthly.totalSpent">Всего потрачено</div>
    <div class="stats-amount" id="total-amount">0 ₲</div>
    <div class="stats-period" id="period">-</div>
</div>

<div class="stats-summary">
    <div class="summary-item">
        <div class="summary-label" data-i18n="monthly.purchases">покупок</div>
        <div class="summary-value" id="total-purchases">0</div>
    </div>
    <div class="summary-item">
        <div class="summary-label" data-i18n="monthly.stores">магазинов</div>
        <div class="summary-value" id="total-stores">0</div>
    </div>
</div>

<div class="categories-section">
    <h2 data-i18n="monthly.topCategories">Топ категорий</h2>
    <div id="categories-list"></div>
</div>

<div class="stores-section">
    <h2 data-i18n="monthly.topStores">Топ магазинов</h2>
    <div id="stores-list"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/monthly-stats.js"></script>
</body>
</html>

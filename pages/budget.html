<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .tabs {
            display: flex;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 5px;
            gap: 5px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
        }
        .content { display: none; padding: 15px; }
        .content.active { display: block; }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
        }
        .stat .label { font-size: 12px; opacity: 0.7; margin-top: 5px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .card.up { border-left: 3px solid #ef4444; }
        .card.down { border-left: 3px solid #10b981; }
        .product-name { font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .store { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
        .prices { display: flex; gap: 12px; font-size: 13px; }
        .price-current { font-weight: 700; font-size: 16px; }
        .price-old { opacity: 0.5; text-decoration: line-through; }
        .loading { text-align: center; padding: 40px 20px; opacity: 0.5; }
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 10px; margin: 10px 0; }
        .debug { background: #ffe; padding: 10px; margin: 10px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Покупки в супермаркетах</h1>
        <p>Анализ цен и экономия</p>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('overview')">📊 Обзор</div>
        <div class="tab" onclick="switchTab('trends')">📈 Тренды</div>
        <div class="tab" onclick="switchTab('compare')">🏪 Магазины</div>
    </div>
    
    <div id="tab-overview" class="content active">
        <div id="debug" class="debug"></div>
        <div class="stats">
            <div class="stat">
                <div class="value" id="total">-</div>
                <div class="label">Расходы</div>
            </div>
            <div class="stat">
                <div class="value" id="purchases">-</div>
                <div class="label">Покупок</div>
            </div>
            <div class="stat">
                <div class="value" id="products">-</div>
                <div class="label">Товаров</div>
            </div>
            <div class="stat">
                <div class="value" id="stores">-</div>
                <div class="label">Магазинов</div>
            </div>
        </div>
        <div style="font-weight: 600; margin-bottom: 10px;">📈 Последние изменения</div>
        <div id="quick-trends"><div class="loading">⏳ Загрузка...</div></div>
    </div>
    
    <div id="tab-trends" class="content">
        <div id="trends-list"><div class="loading">⏳ Загрузка...</div></div>
    </div>
    
    <div id="tab-compare" class="content">
        <div id="compare-list"><div class="loading">⏳ Загрузка...</div></div>
    </div>
    
    <script>
        // КОНФИГУРАЦИЯ
        const CONFIG = {
            API_BASE_URL: 'https://14f66ed9f07e.ngrok-free.app/', // ← ЗАМЕНИ НА СВОЙ!
            ENDPOINTS: {
                STATISTICS: '/statistics',
                PRICE_TRENDS: '/prices/trends',
                PRICE_COMPARE: '/prices/compare'
            }
        };
        
        // DEBUG
        function debug(msg) {
            console.log(msg);
            const el = document.getElementById('debug');
            if (el) el.innerHTML += msg + '<br>';
        }
        
        debug('🔧 API URL: ' + CONFIG.API_BASE_URL);
        
        // API CLIENT
        class APIClient {
            constructor() {
                this.baseURL = CONFIG.API_BASE_URL;
            }
            
            async get(endpoint, params = {}) {
                const url = this.buildURL(endpoint, params);
                debug('📡 Запрос: ' + url);
                
                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'ngrok-skip-browser-warning': 'true'
                        }
                    });
                    
                    debug('✅ Ответ: ' + response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    debug('📦 Данные получены');
                    return data;
                } catch (error) {
                    debug('❌ Ошибка: ' + error.message);
                    throw error;
                }
            }
            
            buildURL(endpoint, params = {}) {
                const url = new URL(this.baseURL + endpoint);
                Object.keys(params).forEach(key => {
                    if (params[key] != null) {
                        url.searchParams.append(key, params[key]);
                    }
                });
                return url.toString();
            }
        }
        
        const api = new APIClient();
        const API = {
            getStatistics: () => api.get(CONFIG.ENDPOINTS.STATISTICS),
            getPriceTrends: (days, pattern, limit) => {
                const params = { days, limit };
                if (pattern) params.product_pattern = pattern;
                return api.get(CONFIG.ENDPOINTS.PRICE_TRENDS, params);
            },
            comparePrices: (pattern, limit) => {
                const params = { limit };
                if (pattern) params.product_pattern = pattern;
                return api.get(CONFIG.ENDPOINTS.PRICE_COMPARE, params);
            }
        };
        
        // TELEGRAM
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => window.history.back());
        
        // ЗАГРУЗКА
        async function init() {
            try {
                const stats = await API.getStatistics();
                document.getElementById('total').textContent = formatMoney(stats.total_spent);
                document.getElementById('purchases').textContent = stats.total_purchases;
                document.getElementById('products').textContent = stats.unique_products;
                document.getElementById('stores').textContent = stats.unique_stores;
                
                const trends = await API.getPriceTrends(7, null, 5);
                renderTrends(trends, 'quick-trends');
                
                tg.HapticFeedback.notificationOccurred('success');
            } catch (error) {
                showError('quick-trends', error.message);
            }
        }
        
        async function loadTrends() {
            try {
                const trends = await API.getPriceTrends(30, null, 50);
                renderTrends(trends, 'trends-list');
            } catch (error) {
                showError('trends-list', error.message);
            }
        }
        
        async function loadCompare() {
            try {
                const data = await API.comparePrices(null, 50);
                renderCompare(data, 'compare-list');
            } catch (error) {
                showError('compare-list', error.message);
            }
        }
        
        function renderTrends(trends, elId) {
            if (!trends?.length) {
                document.getElementById(elId).innerHTML = '<div class="loading">📊 Нет данных</div>';
                return;
            }
            const html = trends.map(t => `
                <div class="card ${t.trend_direction}">
                    <div class="product-name">${t.product_name}</div>
                    <div class="store">🏪 ${t.store_name}</div>
                    <div class="prices">
                        <span class="price-current">${t.current_price.toFixed(0)} ₲</span>
                        ${t.previous_price ? `
                            <span class="price-old">${t.previous_price.toFixed(0)} ₲</span>
                            <span style="color:${t.trend_direction==='up'?'#ef4444':'#10b981'}">
                                ${t.trend_direction==='up'?'📈':'📉'} ${Math.abs(t.percent_change||0).toFixed(1)}%
                            </span>
                        ` : '🆕'}
                    </div>
                </div>
            `).join('');
            document.getElementById(elId).innerHTML = html;
        }
        
        function renderCompare(data, elId) {
            if (!data?.length) {
                document.getElementById(elId).innerHTML = '<div class="loading">🏪 Нет данных</div>';
                return;
            }
            const html = data.map(c => `
                <div class="card">
                    <div class="product-name">🛒 ${c.product_name}</div>
                    ${c.stores.map(s => `
                        <div class="store">
                            ${s.store_name === c.cheapest_store ? '🏆' : '🏪'} ${s.store_name}: 
                            <strong>${s.price.toFixed(0)} ₲</strong>
                        </div>
                    `).join('')}
                </div>
            `).join('');
            document.getElementById(elId).innerHTML = html;
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'trends') loadTrends();
            else if (tab === 'compare') loadCompare();
            
            tg.HapticFeedback.impactOccurred('light');
        }
        
        function formatMoney(n) {
            if (!n) return '0 ₲';
            if (n >= 1000000) return `${(n/1000000).toFixed(1)}M ₲`;
            if (n >= 1000) return `${(n/1000).toFixed(0)}K ₲`;
            return `${Math.round(n).toLocaleString('ru')} ₲`;
        }
        
        function showError(id, msg) {
            document.getElementById(id).innerHTML = `<div class="error">❌ ${msg}</div>`;
        }
        
        init();
        
        tg.MainButton.setText('🔄 Обновить');
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            location.reload();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="home.title">Мой Агент</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/initial-setup.css">
</head>
<body>
<div class="header">
    <h1>🤖 <span data-i18n="home.title">Мой Агент</span></h1>
    <p data-i18n="home.subtitle">Умный помощник для жизни v0.5</p>
    <div class="settings-icon" onclick="openSettings()">⚙️</div>
</div>

<div class="user-greeting">
    <div class="user-greeting-text">
        <h2 id="greeting">Загрузка...</h2>
    </div>
    <div id="family-indicator"></div>
</div>

<div class="navigation-buttons">
    <div class="nav-btn" onclick="openModule('finance')">
        💰 <span data-i18n="nav.finance">Финансы</span>
    </div>
    <div class="nav-btn" onclick="openModule('health')">
        💪 <span data-i18n="nav.health">Здоровье</span>
    </div>
    <div class="nav-btn" onclick="openModule('activity')">
        🏃 <span data-i18n="nav.activity">Активность</span>
    </div>
    <div class="nav-btn" onclick="openModule('doctor')">
        🩺 <span data-i18n="nav.doctor">Мед. консультант</span>
    </div>
</div>

<div class="quick-actions">
    <h3 data-i18n="actions.title">Быстрые действия</h3>
    <div class="action-buttons">
        <div class="action-btn" onclick="openModule('add-expense')">
            💳 <span data-i18n="actions.addExpense">Добавить расход</span>
        </div>
        <div class="action-btn" onclick="openModule('photo-reviews')">
            📸 <span data-i18n="photoReviews.title">Мои предпочтения</span>
        </div>
        <div class="action-btn" onclick="openModule('instructions')">
            📖 <span data-i18n="actions.instructions">Инструкции</span>
        </div>
    </div>
</div>

<div class="invite-modal" id="invite-modal">
    <div class="invite-modal-content">
        <div class="invite-modal-icon">👥</div>
        <h2 data-i18n="family.inviteTitle">Приглашение в семью</h2>
        <div class="invite-modal-text" id="invite-text"></div>
        <div class="invite-message" id="invite-message" style="display: none;"></div>
        <div class="invite-warning" data-i18n="family.warning">
            ⚠️ Если вы уже состоите в семье, вы автоматически выйдете из неё
        </div>
        <div class="invite-expiry" id="invite-expiry"></div>
        <div class="invite-modal-buttons">
            <button class="invite-btn invite-btn-decline" onclick="declineCurrentInvite()" data-i18n="family.decline">
                ❌ Отклонить
            </button>
            <button class="invite-btn invite-btn-accept" onclick="acceptCurrentInvite()" data-i18n="family.accept">
                ✅ Принять
            </button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/cache.js"></script>
<script src="js/cache-invalidator.js"></script>
<script src="js/api.js"></script>
<script src="js/api-extensions.js"></script>
<!-- Модульная система i18n -->
<script src="js/i18n/core.js"></script>
<script src="js/i18n/common.js"></script>
<script src="js/i18n/home.js"></script>
<script src="js/i18n/monthly-stats.js"></script>
<script src="js/i18n/family.js"></script>
<script src="js/i18n/photo-reviews.js"></script>
<script src="js/i18n-page-loader.js"></script>
<!-- END: i18n -->
<script src="js/currency.js"></script>
<script src="js/timezone.js"></script>
<script src="js/timezone-init.js"></script>
<script src="js/initial-setup.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!-- components/health-dashboard.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<!-- components/health-dashboard.html -->
<div class="health-dashboard">
    <!-- Приветствие -->
    <div class="health-card greeting-card">
        <div class="greeting-content">
            <h2 id="greeting-title">👋 Добро пожаловать!</h2>
            <p id="greeting-date"></p>
        </div>
    </div>

    <!-- Сводка -->
    <div id="health-summary" class="health-card">
        <div class="health-card-header">
            <div class="health-card-icon">📈</div>
            <h3 class="health-card-title">Сводка за неделю</h3>
        </div>
        <div id="health-summary-content">
            <div class="loading-spinner-small" style="margin: 20px auto;"></div>
            <p style="text-align: center; color: var(--health-text-light);">Загрузка статистики...</p>
        </div>
    </div>

    <!-- Грид самочувствия -->
    <div class="health-card">
        <div class="health-card-header">
            <div class="health-card-icon">⚡️</div>
            <h3 class="health-card-title">Как самочувствие?</h3>
        </div>
        <div id="wellness-grid">
            <!-- Заполняется динамически -->
        </div>
    </div>

    <!-- Трекер лекарств -->
    <div class="health-card">
        <div class="health-card-header">
            <div class="health-card-icon">💊</div>
            <h3 class="health-card-title">План на сегодня</h3>
        </div>

        <div id="medication-tracker">
            <h3 style="margin-bottom: 16px; color: var(--health-text);">Лекарства на сегодня</h3>

            <div id="today-medications">
                <!-- Лекарства загружаются динамически -->
            </div>

            <div id="no-medications" class="no-medications" style="display: none;">
                <div class="no-meds-icon">💊</div>
                <h3>На сегодня лекарств нет</h3>
                <p>Добавьте лекарства в разделе "Аптечка"</p>
                <button class="health-btn btn-secondary" onclick="HealthModule.switchTab('medications')">
                    Перейти в аптечку
                </button>
            </div>
        </div>

    </div>
</div>

<script>
// Обновляем дату приветствия
document.addEventListener('DOMContentLoaded', function() {
    const debugInfo = document.getElementById('debug-info');
    if (window.CONFIG && window.CONFIG.DEBUG) {
        debugInfo.style.display = 'block';
    }

    // Обновляем дату приветствия
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateElement = document.getElementById('greeting-date');
    if (dateElement) {
        dateElement.textContent = now.toLocaleDateString('ru-RU', options);
    }

    // Устанавливаем заголовок с временем дня
    const greetingTitle = document.getElementById('greeting-title');
    if (greetingTitle) {
        const hour = now.getHours();
        if (hour < 12) {
            greetingTitle.textContent = '👋 Доброе утро!';
        } else if (hour < 18) {
            greetingTitle.textContent = '👋 Добрый день!';
        } else {
            greetingTitle.textContent = '👋 Добрый вечер!';
        }
    }
});
</script>

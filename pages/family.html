<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="family.title">Моя семья</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/family.css">
</head>
<body>
<div class="header">
    <h1>👥 <span data-i18n="family.title">Моя семья</span></h1>
</div>

<div id="family-info" class="family-info">
    <div class="loading" data-i18n="common.loading">Загрузка...</div>
</div>

<div id="family-content" style="display: none;">
    <div class="family-card">
        <div class="family-header">
            <div class="family-name" id="family-name">-</div>
            <div class="family-members" id="family-members">-</div>
        </div>
        
        <div class="family-actions">
            <button class="action-button" onclick="showInviteModal()">
                <span data-i18n="family.inviteMembers">Пригласить участников</span>
            </button>
            <button class="action-button danger" onclick="leaveFamily()">
                <span data-i18n="family.leaveFamily">Покинуть семью</span>
            </button>
        </div>
        
        <div class="members-list" id="members-list"></div>
    </div>
</div>

<div id="no-family" style="display: none;">
    <div class="empty-state">
        <div class="empty-icon">👤</div>
        <div class="empty-title" data-i18n="family.noFamily">Нет семьи</div>
        <button class="create-family-btn" onclick="createFamily()">
            <span data-i18n="family.createFamily">Создать семью</span>
        </button>
    </div>
</div>

<!-- Modal для приглашения -->
<div class="modal" id="invite-modal" style="display: none;">
    <div class="modal-content">
        <h2 data-i18n="family.inviteMembers">Пригласить участников</h2>
        <div class="invite-link-container">
            <div class="invite-link" id="invite-link">-</div>
            <button class="copy-link-btn" onclick="copyInviteLink()">
                <span data-i18n="family.copyLink">Скопировать ссылку</span>
            </button>
        </div>
        <button class="modal-close" onclick="closeInviteModal()" data-i18n="common.close">Закрыть</button>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<script src="../js/api.js"></script>
<script src="../js/family.js"></script>
</body>
</html>

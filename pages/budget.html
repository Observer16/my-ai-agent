<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="budget.title">Покупки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/budget.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="budget.title">Покупки в супермаркетах</span></h1>
    <p data-i18n="budget.subtitle">Анализ цен и экономия</p>
</div>

<!-- Баннер месячных расходов -->
<div class="monthly-banner" id="monthly-banner" onclick="openMonthlyStats()">
    <div class="monthly-banner-header">
        <span>💰 <span data-i18n="budget.monthlyExpenses">Расходы за текущий месяц</span></span>
        <span class="monthly-banner-arrow">→</span>
    </div>
    <div class="monthly-banner-amount" id="monthly-banner-amount">-</div>
    <div class="monthly-banner-details">
        <span>📅 <span id="monthly-banner-period">-</span></span>
        <span>🧾 <span id="monthly-banner-purchases">-</span> <span data-i18n="budget.purchases">покупок</span></span>
        <span>🏪 <span id="monthly-banner-stores">-</span> <span data-i18n="budget.stores">магазинов</span></span>
    </div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">📊 <span data-i18n="budget.tabOverview">Обзор</span></div>
    <div class="tab" onclick="switchTab('trends')">📈 <span data-i18n="budget.tabTrends">Тренды</span></div>
    <div class="tab" onclick="switchTab('compare')">🏪 <span data-i18n="budget.tabCompare">Сравнение</span></div>
</div>

<!-- Обзор -->
<div id="tab-overview" class="content active">
    <div class="stats">
        <div class="stat">
            <div class="value" id="total">-</div>
            <div class="label" data-i18n="budget.expenses">Расходы</div>
        </div>
        <div class="stat">
            <div class="value" id="purchases">-</div>
            <div class="label" data-i18n="budget.purchasesCount">Покупок</div>
        </div>
        <div class="stat">
            <div class="value" id="products">-</div>
            <div class="label" data-i18n="budget.productsCount">Товаров</div>
        </div>
        <div class="stat">
            <div class="value" id="stores">-</div>
            <div class="label" data-i18n="budget.recipients">Получателей</div>
        </div>
    </div>

    <div class="section-title">🧾 <span data-i18n="budget.recentReceipts">Последние чеки</span></div>
    <div id="recent-receipts"></div>
</div>

<!-- Тренды -->
<div id="tab-trends" class="content">
    <div class="filters">
        <button class="filter-btn active" onclick="filterTrends(7)" data-i18n="budget.filter7days">7 дней</button>
        <button class="filter-btn" onclick="filterTrends(30)" data-i18n="budget.filter30days">30 дней</button>
        <button class="filter-btn" onclick="filterTrends(90)" data-i18n="budget.filter90days">90 дней</button>
    </div>

    <div class="search">
        <input type="text" id="trends-search" data-i18n-target="placeholder" data-i18n="budget.searchProduct" placeholder="🔍 Поиск товара..." onkeyup="searchTrends(this.value)">
    </div>

    <div id="trends-list"></div>
</div>

<!-- Сравнение -->
<div id="tab-compare" class="content">
    <div class="search">
        <input type="text" id="compare-search" data-i18n-target="placeholder" data-i18n="budget.searchProduct" placeholder="🔍 Поиск товара..." onkeyup="searchCompare(this.value)">
    </div>

    <div id="compare-list"></div>
</div>

<!-- NEW: Модульная система i18n -->
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/budget.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<!-- END: i18n -->
<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = '../index.html');

    let currentDays = 7;
    let trendsData = [];
    let compareData = [];

    async function init() {
        await initCurrency();

        try {
            await loadOverview();
            await loadMonthlyBanner();
            tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
            console.error('Init error:', error);
        }
    }

    async function loadMonthlyBanner() {
        try {
            const stats = await API.getMonthlyStatistics();
            document.getElementById('monthly-banner-amount').textContent = formatMoney(stats.summary.total_spent);
            
            const now = new Date();
            const monthName = getMonthName(now.getMonth());
            document.getElementById('monthly-banner-period').textContent = monthName;
            document.getElementById('monthly-banner-purchases').textContent = stats.summary.total_purchases;
            document.getElementById('monthly-banner-stores').textContent = stats.summary.unique_stores;
        } catch (error) {
            console.error('Ошибка загрузки месячной статистики:', error);
            document.getElementById('monthly-banner').style.display = 'none';
        }
    }

    function openMonthlyStats() {
        tg.HapticFeedback.impactOccurred('medium');
        window.location.href = 'monthly-stats.html';
    }

    async function loadOverview() {
        try {
            const stats = await API.getStatistics();
            document.getElementById('total').textContent = formatMoney(stats.total_spent);
            document.getElementById('purchases').textContent = stats.total_purchases;
            document.getElementById('products').textContent = stats.unique_products;
            document.getElementById('stores').textContent = stats.unique_stores;
            await loadRecentReceipts();
        } catch (error) {
            showError('recent-receipts', error.message);
        }
    }

    async function loadRecentReceipts() {
        showLoading('recent-receipts');
        try {
            const receipts = await API.getRecentPurchases(7);
            renderReceipts(receipts);
        } catch (error) {
            showError('recent-receipts', error.message);
        }
    }

    function renderReceipts(receipts) {
        const container = document.getElementById('recent-receipts');

        if (!receipts?.length) {
            container.innerHTML = `<div class="empty">🧾 ${t('budget.noReceipts')}</div>`;
            return;
        }

        const html = receipts.map(r => {
            const date = formatReceiptDate(r.purchase_date);
            const time = formatReceiptTime(r.purchase_date);

            return `
                <div class="receipt-card">
                    <div class="receipt-header">
                        <div>
                            <div class="receipt-store">🏪 ${r.store_name}</div>
                            <div class="receipt-store-type">${r.store_type || t('budget.storeType')}</div>
                        </div>
                        <div class="receipt-amount">${formatMoney(r.total_amount)}</div>
                    </div>
                    <div class="receipt-info">
                        <span>📅 ${date}</span>
                        <span>🕐 ${time}</span>
                        <span>📦 ${r.items_count} ${t('budget.positions')}</span>
                        ${r.payment_method ? `<span>💳 ${r.payment_method}</span>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        container.innerHTML = html;
    }

    function formatReceiptDate(dateStr) {
        if (!dateStr) return '-';

        const date = new Date(dateStr);
        const now = new Date();
        const diffTime = now - date;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return t('budget.today');
        if (diffDays === 1) return t('budget.yesterday');
        if (diffDays < 7) return `${diffDays} ${t('budget.daysAgo')}`;

        return date.toLocaleDateString(getCurrentLanguage() === 'ru' ? 'ru-RU' : 'en-US', {
            day: 'numeric',
            month: 'short',
            year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
        });
    }

    function formatReceiptTime(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleTimeString(getCurrentLanguage() === 'ru' ? 'ru-RU' : 'en-US', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function loadTrends(days = 7, search = null) {
        showLoading('trends-list');
        try {
            trendsData = await API.getPriceTrends(days, search, 50);
            renderTrends(trendsData, 'trends-list');
        } catch (error) {
            showError('trends-list', error.message);
        }
    }

    async function loadCompare(search = null) {
        showLoading('compare-list');
        try {
            compareData = await API.comparePrices(search, 50);
            renderCompare(compareData);
        } catch (error) {
            console.error('Ошибка загрузки сравнения:', error);

            let errorMessage = t('budget.error');
            if (error.message.includes('403') || error.message.includes('Доступ запрещен')) {
                errorMessage = '🔒 ' + t('budget.accessDenied');
            } else if (error.message.includes('401') || error.message.includes('авторизац')) {
                errorMessage = '🔑 ' + t('budget.authRequired');
            } else if (error.message) {
                errorMessage = `${t('common.error')}: ${error.message}`;
            }

            showError('compare-list', errorMessage);
        }
    }

    function renderTrends(trends, containerId) {
        const container = document.getElementById(containerId);

        if (!trends?.length) {
            container.innerHTML = `<div class="empty">📊 ${t('budget.noTrendsData')}</div>`;
            return;
        }

        const html = trends.map(t_item => `
            <div class="card ${t_item.trend_direction}">
                <div class="product-name">${t_item.product_name}</div>
                <div class="store">🏪 ${t_item.store_name}</div>
                <div class="prices">
                    <span class="price-current">${t_item.current_price.toFixed(0)} ${getCurrencySymbol()}</span>
                    ${t_item.previous_price ? `
                        <span class="price-old">${t_item.previous_price.toFixed(0)} ${getCurrencySymbol()}</span>
                        <span class="price-change ${t_item.trend_direction}">
                            ${t_item.trend_direction === 'up' ? '📈' : '📉'}
                            ${Math.abs(t_item.percent_change || 0).toFixed(1)}%
                        </span>
                    ` : `<span>🆕 ${t('budget.newProduct')}</span>`}
                </div>
            </div>
        `).join('');

        container.innerHTML = html;
    }

    function formatPrice(price) {
        if (!price && price !== 0) return `0 ${getCurrencySymbol()}`;

        const num = typeof price === 'object' && price.toString ?
                    parseFloat(price.toString()) :
                    Number(price);

        if (isNaN(num)) return `0 ${getCurrencySymbol()}`;

        if (Number.isInteger(num)) {
            return num.toLocaleString(getCurrentLanguage() === 'ru' ? 'ru-RU' : 'en-US') + ' ' + getCurrencySymbol();
        }

        return num.toLocaleString(getCurrentLanguage() === 'ru' ? 'ru-RU' : 'en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + ' ' + getCurrencySymbol();
    }

    function renderCompare(data) {
        const container = document.getElementById('compare-list');

        if (!data?.length) {
            container.innerHTML = `
                <div class="empty">
                    <div style="font-size: 48px; margin-bottom: 10px;">🏪</div>
                    <div style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">
                        ${t('budget.noCompareData')}
                    </div>
                    <div style="font-size: 13px; opacity: 0.7; line-height: 1.5;">
                        ${t('budget.compareDescription')}
                    </div>
                </div>
            `;
            return;
        }

        const html = data.map(c => `
            <div class="comparison-card">
                <div class="comparison-header">🛒 ${c.product_name}</div>
                ${c.stores.map(s => `
                    <div class="store-price ${s.store_name === c.cheapest_store ? 'best' : ''}">
                        <span>
                            ${s.store_name === c.cheapest_store ? '🏆' : '🏪'}
                            ${s.store_name}
                        </span>
                        <strong>${formatPrice(s.price)}</strong>
                    </div>
                `).join('')}
            </div>
        `).join('');

        container.innerHTML = html;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t_el => t_el.classList.remove('active'));
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');

        if (tab === 'trends' && !trendsData.length) {
            loadTrends(currentDays);
        } else if (tab === 'compare') {
            loadCompare();
        }

        tg.HapticFeedback.impactOccurred('light');
    }

    function filterTrends(days) {
        currentDays = days;

        document.querySelectorAll('.filters .filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        loadTrends(days);
        tg.HapticFeedback.impactOccurred('light');
    }

    let searchTrendsTimeout;
    function searchTrends(query) {
        clearTimeout(searchTrendsTimeout);
        searchTrendsTimeout = setTimeout(() => {
            loadTrends(currentDays, query || null);
        }, 500);
    }

    let searchCompareTimeout;
    function searchCompare(query) {
        clearTimeout(searchCompareTimeout);
        searchCompareTimeout = setTimeout(() => {
            loadCompare(query || null);
        }, 500);
    }

    function formatMoney(amount) {
        if (!amount && amount !== 0) return `0 ${getCurrencySymbol()}`;

        const numAmount = Number(amount);
        if (isNaN(numAmount)) return `0 ${getCurrencySymbol()}`;

        if (numAmount === 0) return `0 ${getCurrencySymbol()}`;

        const absAmount = Math.abs(numAmount);

        if (absAmount >= 1000000) {
            const millions = (numAmount / 1000000).toFixed(1);
            return `${millions}M ${getCurrencySymbol()}`;
        }
        else if (absAmount >= 1000) {
            const thousands = (numAmount / 1000).toFixed(1);
            return `${thousands}K ${getCurrencySymbol()}`;
        }
        else {
            if (Number.isInteger(numAmount)) {
                return `${numAmount.toLocaleString(getCurrentLanguage() === 'ru' ? 'ru-RU' : 'en-US')} ${getCurrencySymbol()}`;
            } else {
                return `${numAmount.toFixed(2).replace('.', ',')} ${getCurrencySymbol()}`;
            }
        }
    }

    function showLoading(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <div style="font-size:48px; animation: spin 1s linear infinite;">⏳</div>
                <div style="margin-top:10px; opacity:0.7;">${t('budget.loading')}</div>
            </div>
        `;
    }

    function showError(containerId, message) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div class="empty">
                <div style="font-size:48px; margin-bottom:10px;">⚠️</div>
                <div>${message}</div>
            </div>
        `;
    }

    init();

    tg.MainButton.setText('🔄 ' + t('budget.refresh'));
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
        if (typeof API !== 'undefined' && API.clearCache) {
            API.clearCache();
        }
        init();
        tg.HapticFeedback.impactOccurred('medium');
    });
</script>
</body>
</html>

<!-- components/health-dashboard.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<div class="health-dashboard">
    <!-- Приветствие -->
    <div class="health-card greeting-card">
        <div class="greeting-content">
            <h2>👋 Добро пожаловать!</h2>
        </div>
    </div>

    <!-- Сводка -->
    <div id="health-summary">
        <!-- Заполняется динамически -->
    </div>

    <!-- Грид самочувствия -->
    <div class="health-card">
        <div class="health-card-header">
            <div class="health-card-icon">⚡️</div>
            <h3 class="health-card-title">Как самочувствие?</h3>
        </div>
        <div id="wellness-grid">
            <!-- Заполняется динамически -->
        </div>
    </div>

    <!-- Трекер лекарств -->
    <div class="health-card">
        <div class="health-card-header">
            <div class="health-card-icon">💊</div>
            <h3 class="health-card-title">План на сегодня</h3>
        </div>

        <div id="medication-tracker">
            <!-- Заголовок трекера -->
            <h3 style="margin-bottom: 16px; color: var(--health-text);">Лекарства на сегодня</h3>

            <!-- Контейнер для лекарств с правильной структурой -->
            <div id="today-medications">
                <!-- Лекарства загружаются динамически с правильной структурой -->
            </div>

            <!-- Состояние "нет лекарств" -->
            <div id="no-medications" class="no-medications" style="display: none;">
                <div class="no-meds-icon">💊</div>
                <h3>На сегодня лекарств нет</h3>
                <p>Добавьте лекарства в разделе "Аптечка"</p>
                <button class="health-btn btn-secondary" onclick="HealthModule.switchTab('medications')">
                    Перейти в аптечку
                </button>
            </div>
        </div>

        <!-- Заметки -->
        <div class="form-section" style="margin-top: 20px;">
            <label for="notes-input">Заметки на сегодня</label>
            <textarea
                id="notes-input"
                rows="3"
                placeholder="Добавьте заметки о самочувствии..."
                style="width: 100%; box-sizing: border-box;"
            ></textarea>
        </div>

        <!-- Кнопка сохранения -->
        <div class="form-actions" style="margin-top: 20px;">
            <button class="health-btn btn-primary" onclick="saveEntry()">
                💾 Сохранить все данные
            </button>
            <button class="health-btn btn-secondary refresh-dashboard-btn">
                🔄 Обновить
            </button>
        </div>
    </div>

</div>

<script>
// Отладочная функция
async function testHealthAPI() {
    const output = document.getElementById('debug-output');
    if (!output) return;

    output.innerHTML = '<p>🧪 Тестирование API...</p>';

    try {
        // Тест 1: Получение опций пользователя
        output.innerHTML += '<p>1. Получение опций пользователя...</p>';
        const options = await HealthAPI.getUserOptions();
        output.innerHTML += `<p>✅ Опции: ${JSON.stringify(options)}</p>`;

        // Тест 2: Получение лекарств на сегодня
        output.innerHTML += '<p>2. Получение лекарств на сегодня...</p>';
        const meds = await HealthAPI.getTodayMedications();
        output.innerHTML += `<p>✅ Лекарств: ${JSON.stringify(meds)}</p>`;

        // Тест 3: Получение записи за сегодня
        output.innerHTML += '<p>3. Получение записи за сегодня...</p>';
        const today = new Date().toISOString().split('T')[0];
        const entry = await HealthAPI.getEntryByDate(today);
        output.innerHTML += `<p>✅ Запись: ${JSON.stringify(entry)}</p>`;

    } catch (error) {
        output.innerHTML += `<p style="color: red;">❌ Ошибка: ${error.message}</p>`;
    }
}

// Показываем отладочную информацию в режиме разработки
document.addEventListener('DOMContentLoaded', function() {
    const debugInfo = document.getElementById('debug-info');
    if (window.CONFIG && window.CONFIG.DEBUG) {
        debugInfo.style.display = 'block';
    }

    // Обновляем дату приветствия
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateElement = document.getElementById('greeting-date');
    if (dateElement) {
        dateElement.textContent = now.toLocaleDateString('ru-RU', options);
    }
});
</script>

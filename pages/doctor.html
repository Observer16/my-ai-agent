<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Медицинский консультант</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="header">
    <h1>🩺 Медицинский консультант</h1>
    <p>AI-помощник для здоровья</p>
</div>

<div class="chat-container">
    <div id="messages"></div>
    <div class="chat-input">
        <input type="text" id="message-input" placeholder="Опишите ваши симптомы...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<div class="empty" style="margin-top: 100px;">
    <div style="font-size: 64px; margin-bottom: 20px;">🏗️</div>
    <h3>Модуль в разработке</h3>
    <p>Скоро здесь будет AI-консультант для первой помощи</p>
    <p style="font-size: 12px; opacity: 0.7; margin-top: 10px;">⚠️ Не заменяет профессиональную медицинскую помощь</p>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/api.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = '../index.html');

    function sendMessage() {
        const input = document.getElementById('message-input');
        const message = input.value.trim();
        if (message) {
            tg.showAlert('Функция в разработке');
            input.value = '';
        }
    }
</script>
</body>
</html>

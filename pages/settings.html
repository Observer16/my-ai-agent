<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="settings.title">Настройки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="header">
    <h1>⚙️ <span data-i18n="settings.title">Настройки</span></h1>
</div>

<!-- Настройки языка -->
<div class="module-card">
    <div class="module-header">
        <div class="module-icon">🗣️</div>
        <div class="module-title" data-i18n="settings.language">Язык интерфейса</div>
    </div>
    <div class="settings-item">
        <label for="language-select" data-i18n="initialSetup.selectLanguage">Выберите язык</label>
        <select id="language-select" class="settings-select">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
    </div>
    <div class="settings-description" data-i18n="settings.languageDescription">
        Язык интерфейса приложения
    </div>
</div>

<!-- Настройки валюты -->
<div class="module-card">
    <div class="module-header">
        <div class="module-icon">💰</div>
        <div class="module-title" data-i18n="settings.currency">Валюта</div>
    </div>
    <div class="settings-item">
        <label for="currency-select" data-i18n="settings.yourCurrency">Ваша валюта</label>
        <select id="currency-select" class="settings-select">
            <option value="PYG">₲ Парагвайский гуарани (PYG)</option>
            <option value="USD">$ Доллар США (USD)</option>
            <option value="EUR">€ Евро (EUR)</option>
            <option value="RUB">₽ Российский рубль (RUB)</option>
            <option value="BRL">R$ Бразильский реал (BRL)</option>
            <option value="UAH">₴ Украинская гривна (UAH)</option>
        </select>
    </div>
    <div class="settings-description" data-i18n="settings.currencyDescription">
        Все суммы будут отображаться в выбранной валюте
    </div>
</div>

<!-- Семья -->
<div class="module-card" onclick="openFamily()">
    <div class="module-header">
        <div class="module-icon">👥</div>
        <div class="module-title" data-i18n="family.title">Моя семья</div>
    </div>
    <div class="module-description" id="family-status" data-i18n="common.loading">
        Загрузка...
    </div>
</div>

<!-- Информация о пользователе -->
<div class="module-card">
    <div class="module-header">
        <div class="module-icon">👤</div>
        <div class="module-title" data-i18n="settings.profile">Профиль</div>
    </div>
    <div class="settings-item">
        <div class="settings-label" data-i18n="settings.name">Имя</div>
        <div class="settings-value" id="user-name">-</div>
    </div>
    <div class="settings-item">
        <div class="settings-label" data-i18n="settings.telegramId">Telegram ID</div>
        <div class="settings-value" id="user-telegram-id">-</div>
    </div>
    <div class="settings-item">
        <div class="settings-label" data-i18n="settings.timezone">Часовой пояс</div>
        <div class="settings-value" id="user-timezone">-</div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="finance.title">Финансы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/budget.css">
    <link rel="stylesheet" href="../css/receipt-modal.css">
</head>
<body>
<div class="header">
    <h1>💰 <span data-i18n="finance.title">Финансы</span></h1>
    <p data-i18n="finance.subtitle">Управление расходами и аналитика</p>
</div>

<!-- Контейнер для баннера месячных расходов (подключается через компонент) -->
<div id="monthly-banner-container"></div>

<div class="finance-actions">
    <div class="finance-action-btn" onclick="openModule('add-expense')">
        💳 <span data-i18n="actions.addExpense">Добавить расход</span>
    </div>
    <div class="finance-action-btn" onclick="openModule('products')">
        📦 <span data-i18n="actions.management">Управление</span>
    </div>
    <div class="finance-action-btn" onclick="openModule('budget')">
        📊 <span data-i18n="actions.priceAnalysis">Анализ цен</span>
    </div>
</div>

<!-- Модульная система i18n -->
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/budget.js"></script>
<script src="../js/i18n/home.js"></script>
<script src="../js/i18n/finance.js"></script>
<script src="../js/i18n/monthly-stats.js"></script>
<script src="../js/i18n-page-loader.js"></script>

<!-- Общие утилиты -->
<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>

<!-- Компонент баннера и основная логика -->
<script src="../js/components/monthly-banner.js"></script>
<script src="../js/finance.js"></script>
<!-- Компоненты -->
<script src="../js/components/receipt-modal.js"></script>
<script src="../js/components/recent-receipts.js"></script>

<script>
// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', async () => {
    // Инициализируем валюту
    if (typeof initCurrency === 'function') {
        await initCurrency();
    }

    // Инициализируем баннер
    if (window.monthlyBanner) {
        await window.monthlyBanner.init();
    }

    // ✅ НОВОЕ: Инициализируем компонент последних чеков
    if (window.recentReceipts) {
        await window.recentReceipts.init();
    }

    // Инициализируем основную логику finance.js
    if (typeof initFinance === 'function') {
        initFinance();
    }
});

/**
 * Открытие модуля
 */
function openModule(moduleName) {
    const tg = window.Telegram?.WebApp;
    if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
    }

    switch(moduleName) {
        case 'add-expense':
            window.location.href = 'add-expense.html';
            break;
        case 'products':
            window.location.href = 'products.html';
            break;
        case 'budget':
            window.location.href = 'budget.html';
            break;
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="products.title">Управление</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../css/products.css">
</head>
<body>
<div class="header">
    <h1>📦 <span data-i18n="products.title">Управление</span></h1>
    <p data-i18n="products.subtitle">Товары, категории и получатели</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('products')">🛒 <span data-i18n="products.tabProducts">Товары</span></div>
    <div class="tab" onclick="switchTab('categories')">📂 <span data-i18n="products.tabCategories">Категории</span></div>
    <div class="tab" onclick="switchTab('stores')">👥 <span data-i18n="products.tabRecipients">Получатели</span></div>
</div>

<!-- Товары -->
<div id="tab-products" class="content active">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="total-products">-</div>
            <div class="stat-label" data-i18n="products.products">Товаров</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="total-categories">-</div>
            <div class="stat-label" data-i18n="products.categories">Категорий</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="uncategorized">-</div>
            <div class="stat-label" data-i18n="products.uncategorized">Без категории</div>
        </div>
    </div>

    <div class="search">
        <input type="text" id="product-search" 
               data-i18n-target="placeholder" data-i18n="products.searchProduct"
               placeholder="🔍 Поиск товара..."
               onkeyup="searchProducts(this.value)">
    </div>

    <div class="filter-section">
        <div class="filter-label" data-i18n="products.category">Категория</div>
        <div class="category-filter" id="category-filters"></div>
    </div>

    <div id="products-list"></div>
</div>

<!-- Категории -->
<div id="tab-categories" class="content">
    <div id="categories-list"></div>
</div>

<!-- Получатели (Магазины) -->
<div id="tab-stores" class="content">
    <div id="stores-list"></div>
</div>

<!-- Кнопки создания внизу -->
<div class="create-buttons">
    <button class="create-btn" id="btn-create-category" onclick="showCreateCategoryModal()" style="display: none;">
        📂 <span data-i18n="products.createCategory">Создать категорию</span>
    </button>
    
    <button class="create-btn" id="btn-edit-store" onclick="showEditStoreModal()" style="display: none;">
        ✏️ <span data-i18n="products.edit">Редактировать</span>
    </button>
</div>

<!-- Модальное окно создания категории -->
<div class="modal" id="create-category-modal">
    <div class="modal-content">
        <div class="modal-header" data-i18n="products.newCategory">Новая категория</div>
        <div class="form-group">
            <label class="form-label"><span data-i18n="products.name">Название</span> *</label>
            <input type="text" class="form-input" id="new-category-name"
                   data-i18n-target="placeholder" data-i18n="products.enterCategoryName"
                   placeholder="Например: Фрукты">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.description">Описание</label>
            <textarea class="form-textarea" id="new-category-description"
                      data-i18n-target="placeholder" data-i18n="products.descriptionOptional"
                      placeholder="Описание категории (опционально)"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.parentCategory">Родительская категория</label>
            <select class="form-select" id="new-category-parent">
                <option value="" data-i18n="products.noParent">Нет (основная категория)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('create-category-modal')" data-i18n="common.cancel">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="createCategory()" data-i18n="products.create">
                Создать
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования категории -->
<div class="modal" id="edit-category-modal">
    <div class="modal-content">
        <div class="modal-header" data-i18n="products.editCategory">Редактировать категорию</div>
        <div class="form-group">
            <label class="form-label"><span data-i18n="products.name">Название</span> *</label>
            <input type="text" class="form-input" id="edit-category-name"
                   data-i18n-target="placeholder" data-i18n="products.enterCategoryName"
                   placeholder="Название категории">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.description">Описание</label>
            <textarea class="form-textarea" id="edit-category-description"
                      data-i18n-target="placeholder" data-i18n="products.descriptionOptional"
                      placeholder="Описание категории (опционально)"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.parentCategory">Родительская категория</label>
            <select class="form-select" id="edit-category-parent">
                <option value="" data-i18n="products.noParent">Нет (основная категория)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('edit-category-modal')" data-i18n="common.cancel">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="updateCategory()" data-i18n="products.save">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно создания товара -->
<div class="modal" id="create-product-modal">
    <div class="modal-content">
        <div class="modal-header" data-i18n="products.newProduct">Новый товар</div>
        <div class="form-group">
            <label class="form-label"><span data-i18n="products.name">Название</span> *</label>
            <input type="text" class="form-input" id="new-product-name"
                   data-i18n-target="placeholder" data-i18n="products.enterProductName"
                   placeholder="Например: Яблоки">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.brand">Бренд</label>
            <input type="text" class="form-input" id="new-product-brand"
                   data-i18n-target="placeholder" data-i18n="products.brandOptional"
                   placeholder="Бренд (опционально)">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.category">Категория</label>
            <select class="form-select" id="new-product-category">
                <option value="" data-i18n="products.uncategorized">Без категории</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.unit">Единица измерения</label>
            <select class="form-select" id="new-product-unit">
                <option value="unidad" data-i18n="products.unitPiece">Штука</option>
                <option value="kg" data-i18n="products.unitKg">Килограмм</option>
                <option value="g" data-i18n="products.unitG">Грамм</option>
                <option value="l" data-i18n="products.unitL">Литр</option>
                <option value="ml" data-i18n="products.unitMl">Миллилитр</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.barcode">Штрих-код</label>
            <input type="text" class="form-input" id="new-product-barcode"
                   data-i18n-target="placeholder" data-i18n="products.barcodeOptional"
                   placeholder="Штрих-код (опционально)" inputmode="numeric">
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('create-product-modal')" data-i18n="common.cancel">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="createProduct()" data-i18n="products.create">
                Создать
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования товара -->
<div class="modal" id="edit-product-modal">
    <div class="modal-content">
        <div class="modal-header" data-i18n="products.editProduct">Редактировать товар</div>
        <div class="form-group">
            <label class="form-label"><span data-i18n="products.name">Название</span> *</label>
            <input type="text" class="form-input" id="edit-product-name" 
                   data-i18n-target="placeholder" data-i18n="products.enterProductName"
                   placeholder="Название товара">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.brand">Бренд</label>
            <input type="text" class="form-input" id="edit-product-brand" 
                   data-i18n-target="placeholder" data-i18n="products.brandOptional"
                   placeholder="Бренд (опционально)">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.category">Категория</label>
            <select class="form-select" id="edit-product-category">
                <option value="" data-i18n="products.uncategorized">Без категории</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.unit">Единица измерения</label>
            <select class="form-select" id="edit-product-unit">
                <option value="unidad" data-i18n="products.unitPiece">Штука</option>
                <option value="kg" data-i18n="products.unitKg">Килограмм</option>
                <option value="g" data-i18n="products.unitG">Грамм</option>
                <option value="l" data-i18n="products.unitL">Литр</option>
                <option value="ml" data-i18n="products.unitMl">Миллилитр</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.barcode">Штрих-код</label>
            <input type="text" class="form-input" id="edit-product-barcode" 
                   data-i18n-target="placeholder" data-i18n="products.barcodeOptional"
                   placeholder="Штрих-код (опционально)" inputmode="numeric">
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('edit-product-modal')" data-i18n="common.cancel">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="updateProduct()" data-i18n="products.save">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования получателя -->
<div class="modal" id="edit-store-modal">
    <div class="modal-content">
        <div class="modal-header" data-i18n="products.editRecipient">Редактировать получателя</div>
        <div class="form-group">
            <label class="form-label" data-i18n="products.selectRecipient">Выберите получателя</label>
            <select class="form-select" id="store-select" onchange="loadStoreData()">
                <option value="">-- <span data-i18n="products.selectRecipient">Выберите получателя</span> --</option>
            </select>
        </div>
        <div id="store-edit-fields" style="display: none;">
            <div class="form-group">
                <label class="form-label"><span data-i18n="products.name">Название</span> *</label>
                <input type="text" class="form-input" id="store-name" 
                       data-i18n-target="placeholder" data-i18n="products.recipientName"
                       placeholder="Название получателя">
            </div>
            <div class="form-group">
                <label class="form-label" data-i18n="products.recipientType">Тип получателя</label>
                <input type="text" class="form-input" id="store-type" 
                       data-i18n-target="placeholder" data-i18n="products.supermarket"
                       placeholder="Например: Супермаркет">
            </div>
            <div class="form-group">
                <label class="form-label" data-i18n="products.rucOptional">RUC (опционально)</label>
                <input type="text" class="form-input" id="store-ruc" 
                       data-i18n-target="placeholder" data-i18n="products.recipientRuc"
                       placeholder="RUC получателя">
            </div>
            <div class="form-group">
                <label class="form-label" data-i18n="products.addressOptional">Адрес (опционально)</label>
                <textarea class="form-textarea" id="store-address" 
                          data-i18n-target="placeholder" data-i18n="products.recipientAddress"
                          placeholder="Адрес получателя"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="modal-btn secondary" onclick="closeModal('edit-store-modal')" data-i18n="common.cancel">
                Отмена
            </button>
            <button class="modal-btn primary" onclick="updateStore()" id="save-store-btn" style="display: none;" data-i18n="products.save">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- NEW: Модульная система i18n -->
<script src="../js/i18n/core.js"></script>
<script src="../js/i18n/common.js"></script>
<script src="../js/i18n/products.js"></script>
<script src="../js/i18n-page-loader.js"></script>
<!-- END: i18n -->

<script src="../js/config.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/api.js"></script>
<script src="../js/api-extensions.js"></script>

<!-- NEW: Модульные скрипты products -->
<script src="../js/products/products-utils.js"></script>
<script src="../js/products/products-render.js"></script>
<script src="../js/products/products-modals.js"></script>
<script src="../js/products/products-crud.js"></script>
<script src="../js/products/products-init.js"></script>
<!-- END: products modules -->

<script>
// Запуск приложения
init();
</script>
</body>
</html>
